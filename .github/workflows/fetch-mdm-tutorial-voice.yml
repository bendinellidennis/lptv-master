name: Fetch MDM tutorial voice
on:
  push:
    branches:
      - full-package-45838253218
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download voice master
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://production-273614-media-export.storage.googleapis.com/ddc9b2c0-08ab-4719-a9a1-736912bdbd5f/original.m4a?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=descript-api%40production-273614.iam.gserviceaccount.com%2F20260906%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20260906T220051Z&X-Goog-Expires=86400&X-Goog-SignedHeaders=host&X-Goog-' -o MDM_master_voice.m4a
          ffprobe -v error -show_entries format=duration -of default=nw=1 MDM_master_voice.m4a
      - name: Upload voice master
        uses: actions/upload-artifact@v4
        with:
          name: MDM_TUTORIAL_VOICE_MASTER
          path: MDM_master_voice.m4a
          compression-level: 0
