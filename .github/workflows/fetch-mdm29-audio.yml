name: Fetch MDM29 Audio

on:
  push:
    branches:
      - full-package-45838253218
    paths:
      - .github/workflows/fetch-mdm29-audio.yml

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download narration blocks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audio
          fetch() { echo "Fetching $1"; curl --fail --retry 4 --retry-delay 2 -L "$2" -o "audio/$1.mp3"; }

          fetch INTRO "https://storage.moknah.io/mcp/tts/3846/683d7ee9-07f3-44dc-938a-564474e560e0.mp3"
