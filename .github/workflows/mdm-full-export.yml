name: MDM Full Export 45.8.38.19.4.5
on:
  push:
    branches:
      - mdm-full-export-458381945
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 84280d377e2aafde43821b789e07bd51683b842c
          fetch-depth: 1
      - name: Build approved runtime FULL
        shell: bash
        run: |
          python3 - <<'PY'
          import os,re,shutil,pathlib
          root=pathlib.Path('.').resolve()
          out=pathlib.Path('/tmp/mdmfull/runtime')
          out.mkdir(parents=True,exist_ok=True)
          excluded_prefix=('BUILD_CHECK_','MALTA_DRIVING_MASTER_VISUAL_QA_CONTACT_SHEET_')
          excluded_names={'events.txt','top.txt'}
          allowed={'.html','.js','.css','.json','.webmanifest','.sql','.txt','.png','.jpg','.jpeg','.webp','.svg','.gif','.mp4','.webm','.woff','.woff2','.ttf','.ico'}
          included=set()
          def add(rel):
            rel=str(rel).replace('\\','/').lstrip('./')
            if not rel or len(rel)>220 or rel.startswith(('http:','https:','data:','blob:','//')): return
            if '..' in pathlib.PurePosixPath(rel).parts: return
            p=root/rel
            try:
              if not p.is_file(): return
            except OSError:
              return
            if '.git' in p.parts or '.github' in p.parts: return
            if p.name.startswith(excluded_prefix) or p.name in excluded_names: return
            included.add(rel)
          for p in root.iterdir():
            try:
              if not p.is_file(): continue
            except OSError:
              continue
            if p.name.startswith(excluded_prefix) or p.name in excluded_names: continue
            ext=p.suffix.lower()
            if ext in allowed:
              size=p.stat().st_size
              if size<=10*1024*1024 or ext in {'.sql','.html','.json','.webmanifest'}:
                add(p.name)
          for p in (root/'assets').rglob('*') if (root/'assets').exists() else []:
            try:
              if p.is_file(): add(p.relative_to(root))
            except OSError: pass
          # Exact active large runtime chunks loaded by the approved index.
          index=(root/'index.html').read_text('utf-8',errors='ignore')
          for ref in re.findall(r'(?:src|href)=["\']([^"\']+)',index,re.I):
            add(ref.split('?',1)[0].split('#',1)[0])
          for ref in re.findall(r'["\']([A-Za-z0-9_. -]+\.(?:js|css|json|webmanifest|png|jpg|jpeg|webp|svg|gif|mp4|webm|woff2?|ttf|ico))["\']',index,re.I):
            add(ref)
          for rel in sorted(included):
            src=root/rel; dst=out/rel
            dst.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(src,dst)
          (out/'MDM_FULL_VERSION.txt').write_text('Malta Driving Master FULL 45.8.38.19.4.5 APPROVED\nSource commit: 84280d377e2aafde43821b789e07bd51683b842c\nBUILD_CHECK files intentionally excluded.\n',encoding='utf-8')
          print('FILES',len(included))
          print('BYTES',sum((root/r).stat().st_size for r in included))
          PY
          cd /tmp/mdmfull/runtime
          zip -r -q /tmp/mdmfull/MDM_FULL_45_8_38_19_4_5_APPROVED.zip .
          ls -lh /tmp/mdmfull/MDM_FULL_45_8_38_19_4_5_APPROVED.zip
      - name: Upload approved FULL
        uses: actions/upload-artifact@v4
        with:
          name: MDM_FULL_45_8_38_19_4_5_APPROVED_COMPACT
          path: /tmp/mdmfull/MDM_FULL_45_8_38_19_4_5_APPROVED.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
