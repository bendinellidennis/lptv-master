name: MDM Passport 45.8.38.20 Cache Fix
on:
  push:
    branches:
      - mdm-full-export-458381945
permissions:
  contents: write
jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Apply direct Passport completion loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old_css='<link rel="stylesheet" href="styles-458361-compact-proofloop-home.css?v=458361-compact-home-stability">'
          new_css=old_css+'\n<link rel="stylesheet" href="styles-4583820-driver-competence-passport-completion.css?v=45838201-passport-completion-direct">'
          if '45838201-passport-completion-direct' not in s:
              s=s.replace(old_css,new_css)
          old_js='<script src="mdm-driver-competence-passport-458351.js?v=458351-driver-competence-passport-failsafe"></script>'
          new_js='<script src="mdm-driver-competence-passport-458351.js?v=45838201-passport-base-refresh"></script>\n<script src="mdm-driver-competence-passport-completion-4583820.js?v=45838201-passport-completion-direct"></script>'
          s=s.replace(old_js,new_js)
          # remove any earlier duplicate completion loader line if it exists
          s=s.replace('\n<script src="mdm-driver-competence-passport-completion-4583820.js?v=4583820-passport-complete"></script>','')
          s=s.replace('\n<link rel="stylesheet" href="styles-4583820-driver-competence-passport-completion.css?v=4583820-passport-complete">','')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "MDM Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "45.8.38.20.1 Passport Direct Loader Cache Fix"
            git push origin HEAD:main
          fi
