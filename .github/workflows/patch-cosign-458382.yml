name: Patch CoSign 45.8.38.2
on:
  push:
    branches: [cosign-copy-feedback-staging-458382]
    paths: ['.github/workflows/patch-cosign-458382.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cosign-copy-feedback-staging-458382
          fetch-depth: 0
      - name: Apply surgical patch
        shell: python
        run: |
          from pathlib import Path

          old = Path('mdm-instructor-cosign-458381.js').read_text(encoding='utf-8')
          s = old
          s = s.replace('/* Malta Driving Master 45.8.38.1 — Instructor Co-Sign Strict Binding Fix */','/* Malta Driving Master 45.8.38.2 — Instructor Co-Sign Copy Feedback */',1)
          s = s.replace("if(window.MDM_INSTRUCTOR_COSIGN_458381)return;","if(window.MDM_INSTRUCTOR_COSIGN_458382)return;",1)
          s = s.replace("const VERSION='45.8.38.1';","const VERSION='45.8.38.2';",1)
          old_fn = '''async function copyCosignCode(){
           const code=encodeCosign(rawMission());if(!code)return false;
           try{await navigator.clipboard.writeText(code);return true}catch(_){
            const ta=document.createElement('textarea');ta.value=code;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();return true
           }
          }'''
          new_fn = '''function showCopyFeedback(ok,code){
           const host=document.querySelector('.mdm-instructor-cosign-box');if(!host)return;
           let box=host.querySelector('.mdm-cosign-copy-result');
           if(!box){box=document.createElement('div');box.className='mdm-cosign-copy-result mdm-cosign-state';host.appendChild(box)}
           if(ok){
            box.className='mdm-cosign-copy-result mdm-cosign-state verified';
            box.innerHTML='<strong>✅ '+esc(t('Codice co-sign copiato','Co-sign code copied','Kodiċi co-sign ikkupjat'))+'</strong><small>'+esc(t('Ora passa al profilo Scuola e incollalo nel pannello Instructor Co-Sign.','Now switch to the School profile and paste it into Instructor Co-Sign.','Issa mur fil-profil tal-Iskola u waħħlu fil-pannell Instructor Co-Sign.'))+'</small>';
           }else{
            box.className='mdm-cosign-copy-result mdm-cosign-state revision';
            box.innerHTML='<strong>📋 '+esc(t('Copia manualmente questo codice','Copy this code manually','Ikkopja dan il-kodiċi manwalment'))+'</strong><textarea readonly></textarea><small>'+esc(t('Tocca il codice, seleziona tutto e copia.','Tap the code, select all and copy.','Mess il-kodiċi, agħżel kollox u kkopja.'))+'</small>';
            const ta=box.querySelector('textarea');if(ta){ta.value=code;ta.onclick=()=>{ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length)}catch(_){}}}
           }
          }
          async function copyCosignCode(){
           const code=encodeCosign(rawMission());if(!code)return false;
           let ok=false;
           try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(code);ok=true}}catch(_){}
           if(!ok){
            try{
             const ta=document.createElement('textarea');ta.value=code;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.focus();ta.select();try{ta.setSelectionRange(0,code.length)}catch(_){}ok=document.execCommand('copy')===true;ta.remove();
            }catch(_){}
           }
           showCopyFeedback(ok,code);
           const btn=document.querySelector('[data-cosign-copy]');if(ok&&btn)btn.textContent='✅ '+t('Codice copiato','Code copied','Kodiċi ikkupjat');
           return ok;
          }'''
          if old_fn not in s:
              raise SystemExit('copyCosignCode anchor not found')
          s = s.replace(old_fn,new_fn,1)
          s = s.replace('window.MDM_INSTRUCTOR_COSIGN_458381=Object.freeze(','window.MDM_INSTRUCTOR_COSIGN_458382=Object.freeze(',1)
          Path('mdm-instructor-cosign-458382.js').write_text(s,encoding='utf-8')

          idx=Path('index.html').read_text(encoding='utf-8')
          old_loader='<script src="mdm-instructor-cosign-458381.js?v=458381-strict-binding"></script>'
          new_loader='<script src="mdm-instructor-cosign-458382.js?v=458382-copy-feedback"></script>'
          if old_loader not in idx: raise SystemExit('index loader anchor not found')
          Path('index.html').write_text(idx.replace(old_loader,new_loader,1),encoding='utf-8')

          sw=Path('sw.js').read_text(encoding='utf-8')
          if '45.8.38.1' not in sw: raise SystemExit('service worker version anchor not found')
          sw=sw.replace('/* Malta Driving Master 45.8.38.1 */','/* Malta Driving Master 45.8.38.2 */',1)
          sw=sw.replace("const CACHE = 'mdm-build-45-8-38-1-cosign-strict-binding';","const CACHE = 'mdm-build-45-8-38-2-cosign-copy-feedback';",1)
          Path('sw.js').write_text(sw,encoding='utf-8')

          Path('mdm-cosign-copy-feedback-458382.js').unlink(missing_ok=True)
          Path('.github/workflows/patch-cosign-458382.yml').unlink(missing_ok=True)
      - name: Validate JS
        run: |
          node --check mdm-instructor-cosign-458382.js
          node --check sw.js
          grep -q 'mdm-instructor-cosign-458382.js?v=458382-copy-feedback' index.html
      - name: Commit staging result
        run: |
          git config user.name 'bendinellidennis'
          git config user.email 'bendinellidennis@gmail.com'
          git add -A
          git commit -m '45.8.38.2 Co-Sign Copy Feedback'
          git push origin HEAD:cosign-copy-feedback-staging-458382
