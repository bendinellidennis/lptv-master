<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MDM Account Isolation Inspector</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:0;background:#f4f7f9;color:#17364a}
main{max-width:760px;margin:auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.07)}
h1{font-size:22px;margin:0 0 6px}h2{font-size:16px;margin:0 0 10px}
.small{font-size:12px;opacity:.7;word-break:break-word}
.ok{color:#0a7a44;font-weight:800}.bad{color:#b42318;font-weight:800}.warn{color:#9a6700;font-weight:800}
.row{padding:8px 0;border-top:1px solid #e8eef2}.row:first-child{border-top:0}
code{font-size:11px;word-break:break-all}
button{width:100%;padding:12px;border:0;border-radius:12px;background:#0b5f77;color:#fff;font-weight:800}
</style>
</head>
<body><main>
<div class="card"><h1>MDM Account Isolation Inspector</h1><div class="small">Diagnostica sola lettura. Non modifica auth, profilo, progressi o storage.</div></div>
<div class="card" id="auth"></div>
<div class="card"><h2>Chiavi utente</h2><div id="keys"></div></div>
<div class="card"><h2>Verdetto</h2><div id="verdict"></div></div>
<button onclick="location.reload()">Rileggi stato</button>
</main>
<script>
(function(){
const AUTH_KEY='mdm_auth_session_v4410';
const BASE=[
'mdm-v1-progress','mdm-v1-error-replay','mdm-v1-zero-error','mdm-v1-exam-day',
'mdm-v1-coach-recovery','mdm-v1-user-profile','mdm-v1-mission-system',
'mdm-v1-ai-instructor','mdm-v1-coach','mdm-v1-onboarding',
'mdm-v1-pilot-analytics','mdm-v1-personal-roadmap','mdm-v1-lptv-passport',
'mdm-v1-real-road-twin','mdm-v1-real-road-telemetry',
'mdm-v1-real-road-selected-pattern','mdm-v1-real-road-telemetry-mission-launch'
];
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function session(){
 try{
  const raw=localStorage.getItem(AUTH_KEY); const s=raw?JSON.parse(raw):null;
  return {status:String(s&&s.status||'signed_out'),userId:String(s&&s.user&&s.user.id||''),email:String(s&&s.user&&s.user.email||'')};
 }catch(e){return {status:'invalid',userId:'',email:''}}
}
function findEmail(v,d=0){
 if(d>5||v==null)return '';
 if(typeof v==='string'){const s=v.trim().toLowerCase();return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s)?s:''}
 if(Array.isArray(v)){for(const x of v){const e=findEmail(x,d+1);if(e)return e}return ''}
 if(typeof v==='object'){
  for(const k of ['email','userEmail','user_email','accountEmail','account_email'])if(k in v){const e=findEmail(v[k],d+1);if(e)return e}
  for(const k of Object.keys(v))if(/email/i.test(k)){const e=findEmail(v[k],d+1);if(e)return e}
 }
 return '';
}
function profileEmail(raw){try{return raw?findEmail(JSON.parse(raw)):''}catch(e){return ''}}
const s=session();
document.getElementById('auth').innerHTML='<h2>Auth</h2><div><b>status:</b> '+esc(s.status)+'</div><div><b>email:</b> '+esc(s.email||'—')+'</div><div><b>user_id:</b> <code>'+esc(s.userId||'—')+'</code></div>';

let rows=[],globals=0,scoped=0,mismatch=0;
for(const key of BASE){
 const g=localStorage.getItem(key);
 if(g!==null){globals++;rows.push({type:'GLOBAL',key,size:g.length,email:key==='mdm-v1-user-profile'?profileEmail(g):''})}
 if(s.userId){
  const sk=key+'::user:'+s.userId; const v=localStorage.getItem(sk);
  if(v!==null){scoped++;const pe=key==='mdm-v1-user-profile'?profileEmail(v):'';if(pe&&s.email&&pe!==s.email.toLowerCase())mismatch++;rows.push({type:'SCOPED',key:sk,size:v.length,email:pe})}
 }
}
for(let i=0;i<localStorage.length;i++){
 const k=localStorage.key(i);
 if(!k||!k.includes('::user:'))continue;
 if(s.userId&&k.endsWith('::user:'+s.userId))continue;
 if(!BASE.some(b=>k.startsWith(b+'::user:')))continue;
 const v=localStorage.getItem(k);
 rows.push({type:'OTHER USER',key:k,size:v?v.length:0,email:k.startsWith('mdm-v1-user-profile::')?profileEmail(v):''});
}
document.getElementById('keys').innerHTML=rows.length?rows.map(r=>'<div class="row"><b>'+esc(r.type)+'</b> · <code>'+esc(r.key)+'</code><br><span class="small">size '+r.size+(r.email?' · profile email '+esc(r.email):'')+'</span></div>').join(''):'<div class="small">Nessuna chiave utente trovata.</div>';

let v='';
if(s.status!=='authenticated') v='<span class="warn">SIGNED OUT</span><br>Controlla che non restino dati GLOBAL attivi nel runtime.';
else if(mismatch) v='<span class="bad">MISMATCH</span><br>Il profilo scoped dell\'utente autenticato contiene un\'email diversa.';
else if(scoped>0&&globals===0) v='<span class="ok">ISOLAMENTO COERENTE</span><br>Dati scoped presenti e nessuna chiave globale utente.';
else if(scoped>0&&globals>0) v='<span class="warn">MISTO</span><br>Ci sono dati scoped ma anche chiavi globali legacy.';
else if(globals>0) v='<span class="bad">NON ISOLATO</span><br>I dati utente sono ancora solo globali.';
else v='<span class="warn">NESSUN DATO</span>';
document.getElementById('verdict').innerHTML=v+'<div class="small" style="margin-top:8px">globali: '+globals+' · scoped utente corrente: '+scoped+' · mismatch: '+mismatch+'</div>';
})();
</script>
</body></html>
