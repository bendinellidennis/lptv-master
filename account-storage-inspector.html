<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MDM Storage Inspector</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;margin:0;background:#f4f7f9;color:#102f43}main{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 6px 20px rgba(0,0,0,.07)}h1{font-size:21px;margin:0 0 6px}h2{font-size:16px;margin:0 0 8px}.row{padding:9px 0;border-top:1px solid #e6edf2}.row:first-child{border-top:0}.bad{color:#b42318;font-weight:900}.ok{color:#067647;font-weight:900}.small{font-size:12px;opacity:.72;word-break:break-word}code{font-size:11px;word-break:break-all}button{width:100%;padding:12px;border:0;border-radius:12px;background:#0b5f77;color:#fff;font-weight:800;margin-top:10px}</style>
</head><body><main>
<div class="card"><h1>MDM Storage Inspector</h1><div class="small">Sola lettura. Non modifica login, profilo, progressi, cache o dati.</div></div>
<div class="card" id="auth"></div>
<div class="card"><h2>Identità trovate nello storage</h2><div id="hits"></div></div>
<div class="card"><h2>Tutte le chiavi locali</h2><div id="keys"></div></div>
<div class="card"><h2>IndexedDB</h2><div id="idb" class="small">Controllo…</div></div>
<button id="copy">Copia diagnostica</button>
</main><script>
(async function(){
 const AUTH='mdm_auth_session_v4410';
 const sensitive=/token|password|secret|authorization|apikey|key$/i;
 function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
 function auth(){
  try{const raw=localStorage.getItem(AUTH);const s=raw?JSON.parse(raw):null;return {status:String(s?.status||'—'),email:String(s?.user?.email||'—'),id:String(s?.user?.id||'—')}}catch(e){return {status:'invalid',email:'—',id:'—'}}
 }
 function summarizeValue(raw){
  if(raw==null)return [];
  const out=[];
  const seen=new Set();
  function add(k,v){const x=String(v??'').trim();if(!x||seen.has(k+':'+x))return;seen.add(k+':'+x);out.push(k+'='+x.slice(0,140))}
  try{
   const root=JSON.parse(raw);
   function walk(v,d=0){
    if(d>5||v==null)return;
    if(Array.isArray(v)){for(const x of v.slice(0,25))walk(x,d+1);return}
    if(typeof v==='object'){
     for(const [k,x] of Object.entries(v)){
      if(sensitive.test(k))continue;
      if(/email|name|profile|role|owner|user.?id|display|first|last/i.test(k)&&['string','number','boolean'].includes(typeof x))add(k,x);
      if(typeof x==='object')walk(x,d+1);
     }
    }
   } walk(root);
  }catch(_){
   if(/dennis|bendinelli|@gmail\.com/i.test(raw))add('text',raw.replace(/\s+/g,' '));
  }
  return out;
 }
 const a=auth();
 document.getElementById('auth').innerHTML='<h2>Auth corrente</h2><div><b>status:</b> '+esc(a.status)+'</div><div><b>email:</b> '+esc(a.email)+'</div><div><b>user id:</b> <code>'+esc(a.id)+'</code></div>';
 const all=[],hits=[];
 for(let i=0;i<localStorage.length;i++){
  const k=localStorage.key(i);if(!k)continue;
  const raw=localStorage.getItem(k);const summary=summarizeValue(raw);
  all.push({k,size:raw?raw.length:0,summary});
  const joined=(k+' '+summary.join(' ')+' '+(raw||'')).toLowerCase();
  if(joined.includes('dennis')||joined.includes('bendinelli')||joined.includes('maltadrivingmaster@gmail.com')||joined.includes('bendinellidennis@gmail.com'))hits.push({k,size:raw?raw.length:0,summary});
 }
 document.getElementById('hits').innerHTML=hits.length?hits.map(x=>'<div class="row"><div class="bad">'+esc(x.k)+'</div><div class="small">size '+x.size+(x.summary.length?' · '+esc(x.summary.join(' · ')):'')+'</div></div>').join(''):'<div class="ok">Nessuna identità Dennis/Malta trovata nelle chiavi leggibili.</div>';
 document.getElementById('keys').innerHTML=all.map(x=>'<div class="row"><code>'+esc(x.k)+'</code><div class="small">size '+x.size+(x.summary.length?' · '+esc(x.summary.join(' · ')):'')+'</div></div>').join('');
 let dbs=[];try{if(indexedDB.databases){dbs=await indexedDB.databases();document.getElementById('idb').textContent=dbs.length?dbs.map(d=>d.name||'(senza nome)').join(' · '):'Nessun database IndexedDB.'}else document.getElementById('idb').textContent='Safari non espone l’elenco database.'}catch(e){document.getElementById('idb').textContent='Impossibile leggere elenco IndexedDB.'}
 const report={auth:a,identity_hits:hits,keys:all,indexedDB:dbs.map(d=>({name:d.name||'',version:d.version||0}))};
 document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(report,null,2));document.getElementById('copy').textContent='✅ Copiato';}catch(e){document.getElementById('copy').textContent='Copia non disponibile';}};
})();
</script></body></html>
