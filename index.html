<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4ea2">
<link rel="manifest" href="manifest.webmanifest">
<title>LPTV MASTER</title>
<style>
:root{--blue:#0b4ea2;--blue2:#07356f;--bg:#edf3fb;--card:#fff;--text:#172033;--muted:#627087;--ok:#15803d;--bad:#b91c1c;--line:#dbe5f1;--warn:#a16207}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;font-size:30px}header p{margin:6px 0 0;opacity:.9}
main{max-width:820px;margin:auto;padding:18px 14px calc(30px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 8px 24px #15325c18;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:16px;padding:16px 13px;background:var(--blue);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.btn.secondary{background:#e8f0fb;color:#123d7a}.btn.light{background:#f3f6fa;color:#24334b}.btn.danger{background:var(--bad)}.btn:disabled{opacity:.45}
.big{font-size:21px}.muted{color:var(--muted)}.hidden{display:none!important}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}.badge{padding:8px 11px;border-radius:999px;background:#e8f0fb;color:#123d7a;font-weight:700}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px}.timer.warn{color:var(--bad)}
.question{font-size:25px;line-height:1.25;font-weight:800;margin:18px 0}.translation{font-size:19px;line-height:1.35;background:#f3f6fa;border-radius:14px;padding:13px;margin:10px 0 16px}
.option{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#f8fafc;border-radius:15px;padding:15px;margin:10px 0;font-size:18px;color:var(--text)}
.option.selected{border-color:var(--blue);background:#e8f0fb}.option.correct{border-color:var(--ok);background:#eaf8ef}.option.wrong{border-color:var(--bad);background:#fff0f0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions .btn{flex:1;min-width:130px}
.explain{border-left:5px solid var(--blue);background:#f4f8fe;padding:14px;border-radius:12px;margin-top:16px;line-height:1.45}
.stat{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}
.progress{height:12px;background:#e3eaf3;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue)}
select,input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:17px;margin:6px 0 12px}
.small{font-size:14px}.center{text-align:center}
@media(max-width:540px){.grid{grid-template-columns:1fr}.question{font-size:23px}.card{padding:17px}}
</style>
</head>
<body>
<header><h1>🚕 LPTV MASTER</h1><p>English • Italiano • Quiz • Pronuncia</p></header>
<main>
<section id="home">
  <div class="card">
    <h2>Benvenuto Dennis 👋</h2>
    <p class="muted">Database attuale: <strong id="count"></strong> domande verificate e strutturate.</p>
    <div class="grid">
      <button class="btn big" onclick="startExam()">🎯 Esame 35 / 45 min</button>
      <button class="btn big" onclick="showStudySetup()">📚 Studio per argomento</button>
      <button class="btn secondary big" onclick="startWeak()">⚠️ Solo errori</button>
      <button class="btn secondary big" onclick="showStats()">📊 Progressi</button>
    </div>
  </div>
  <div class="card">
    <h3>Regole dell'esame</h3>
    <div class="stat"><span>Domande</span><strong>35</strong></div>
    <div class="stat"><span>Tempo</span><strong>45 minuti</strong></div>
    <div class="stat"><span>Promozione</span><strong>30 / 35</strong></div>
    <div class="stat"><span>Ripetizioni nello stesso test</span><strong>Nessuna</strong></div>
  </div>
</section>

<section id="studySetup" class="hidden">
 <div class="card">
  <div class="topline"><h2>Studio per argomento</h2><button class="btn light" onclick="goHome()">Esci</button></div>
  <label>Categoria</label><select id="category"></select>
  <label>Numero di domande</label><select id="studyCount"><option>10</option><option>20</option><option>35</option><option>50</option></select>
  <button class="btn" onclick="startStudy()">Inizia studio</button>
 </div>
</section>

<section id="quiz" class="hidden">
 <div class="card">
  <div class="topline"><span class="badge" id="qnum"></span><span class="timer" id="timer"></span></div>
  <div class="small muted" id="categoryLabel"></div>
  <div class="question" id="question"></div>
  <div class="actions">
   <button class="btn secondary" onclick="toggleTranslation()">🇮🇹 Traduzione</button>
   <button class="btn secondary" onclick="speakQuestion()">🔊 Ascolta</button>
  </div>
  <div id="questionIt" class="translation hidden"></div>
  <div id="selectHint" class="badge"></div>
  <div id="options"></div>
  <div id="explanation" class="explain hidden"></div>
  <div class="actions">
   <button class="btn light" onclick="exitQuiz()">Esci</button>
   <button class="btn" id="confirmBtn" onclick="confirmAnswer()">Conferma</button>
   <button class="btn hidden" id="nextBtn" onclick="nextQuestion()">Avanti</button>
  </div>
 </div>
</section>

<section id="result" class="hidden">
 <div class="card center">
  <h2 id="resultTitle"></h2><div style="font-size:52px;font-weight:900" id="score"></div>
  <p id="resultText"></p><button class="btn" onclick="goHome()">Torna alla Home</button>
 </div>
 <div class="card"><h3>Risultato per categoria</h3><div id="categoryResults"></div></div>
</section>

<section id="stats" class="hidden">
 <div class="card">
  <div class="topline"><h2>I miei progressi</h2><button class="btn light" onclick="goHome()">Esci</button></div>
  <div id="statsBody"></div><button class="btn danger" onclick="resetProgress()">Azzera progressi</button>
 </div>
</section>
</main>
<script src="database.js"></script>
<script>
const Q=window.LPTV_QUESTIONS||[];
const state={list:[],i:0,selected:new Set(),answered:false,correct:0,mode:'study',remaining:2700,interval:null,details:[]};
const $=id=>document.getElementById(id);
const sections=['home','studySetup','quiz','result','stats'];
function show(id){sections.forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function getProgress(){try{return JSON.parse(localStorage.getItem('lptvProgress'))||{seen:{},wrong:{},exams:[]}}catch{return{seen:{},wrong:{},exams:[]}}}
function saveProgress(p){localStorage.setItem('lptvProgress',JSON.stringify(p))}
function goHome(){clearInterval(state.interval);show('home')}
function init(){ $('count').textContent=Q.length; const cats=[...new Set(Q.map(q=>q.category))].sort();$('category').innerHTML='<option value="ALL">Tutte le categorie</option>'+cats.map(c=>`<option>${c}</option>`).join(''); if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}
function showStudySetup(){show('studySetup')}
function startStudy(){const cat=$('category').value,n=+$('studyCount').value;let pool=cat==='ALL'?Q:Q.filter(q=>q.category===cat);begin(shuffle(pool).slice(0,Math.min(n,pool.length)),'study')}
function startExam(){begin(shuffle(Q).slice(0,Math.min(35,Q.length)),'exam')}
function startWeak(){const p=getProgress();let pool=Q.filter(q=>(p.wrong[q.id]||0)>0);if(!pool.length){alert('Non ci sono ancora domande sbagliate salvate.');return}begin(shuffle(pool).slice(0,Math.min(35,pool.length)),'weak')}
function begin(list,mode){state.list=list;state.i=0;state.correct=0;state.mode=mode;state.details=[];state.remaining=2700;show('quiz');if(mode==='exam'){state.interval=setInterval(tick,1000)}render()}
function tick(){state.remaining--;const m=Math.floor(state.remaining/60),s=state.remaining%60;$('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;$('timer').classList.toggle('warn',state.remaining<=300);if(state.remaining<=0){clearInterval(state.interval);finish()}}
function render(){const q=state.list[state.i];state.selected=new Set();state.answered=false;$('qnum').textContent=`Domanda ${state.i+1} di ${state.list.length}`;$('timer').textContent=state.mode==='exam'?`${Math.floor(state.remaining/60)}:${String(state.remaining%60).padStart(2,'0')}`:'';$('categoryLabel').textContent=q.category;$('question').textContent=q.question;$('questionIt').textContent=q.question_it;$('questionIt').classList.add('hidden');$('selectHint').textContent=q.correct.length===1?'Seleziona 1 risposta':`Seleziona ${q.correct.length} risposte`;$('explanation').classList.add('hidden');$('confirmBtn').classList.remove('hidden');$('nextBtn').classList.add('hidden');
 const order=shuffle(q.answers.map((_,i)=>i)); $('options').innerHTML='';order.forEach(idx=>{const b=document.createElement('button');b.className='option';b.dataset.idx=idx;b.innerHTML=`<strong>${String.fromCharCode(65+idx)}.</strong> <span class="en">${q.answers[idx]}</span><span class="it hidden"><br><small>${q.answers_it[idx]||''}</small></span>`;b.onclick=()=>choose(b,idx,q.correct.length);$('options').appendChild(b)})}
function choose(btn,idx,max){if(state.answered)return;if(state.selected.has(idx)){state.selected.delete(idx);btn.classList.remove('selected')}else{if(state.selected.size>=max)return;state.selected.add(idx);btn.classList.add('selected')}}
function toggleTranslation(){$('questionIt').classList.toggle('hidden');document.querySelectorAll('.option .it').forEach(x=>x.classList.toggle('hidden'))}
function speakQuestion(){const q=state.list[state.i];speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.question);u.lang='en-GB';speechSynthesis.speak(u)}
function confirmAnswer(){const q=state.list[state.i];if(state.selected.size!==q.correct.length){alert(`Seleziona esattamente ${q.correct.length} ${q.correct.length===1?'risposta':'risposte'}.`);return}state.answered=true;const chosen=[...state.selected].sort((a,b)=>a-b),correct=[...q.correct].sort((a,b)=>a-b),ok=JSON.stringify(chosen)===JSON.stringify(correct);if(ok)state.correct++;
 document.querySelectorAll('.option').forEach(b=>{const i=+b.dataset.idx;if(q.correct.includes(i))b.classList.add('correct');else if(state.selected.has(i))b.classList.add('wrong')});
 const p=getProgress();p.seen[q.id]=(p.seen[q.id]||0)+1;if(!ok)p.wrong[q.id]=(p.wrong[q.id]||0)+1;else if(p.wrong[q.id])p.wrong[q.id]=Math.max(0,p.wrong[q.id]-1);saveProgress(p);
 state.details.push({category:q.category,ok});$('explanation').innerHTML=`<strong>${ok?'✅ Risposta corretta':'❌ Risposta errata'}</strong><p>${q.explanation||''}</p><p><strong>Italiano:</strong> ${q.explanation_it||''}</p>`;$('explanation').classList.remove('hidden');$('confirmBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden')}
function nextQuestion(){if(state.i<state.list.length-1){state.i++;render();window.scrollTo(0,0)}else finish()}
function exitQuiz(){if(confirm('Vuoi uscire dal test?'))goHome()}
function finish(){clearInterval(state.interval);show('result');const total=state.list.length,pass=state.mode==='exam'&&state.correct>=30;$('resultTitle').textContent=state.mode==='exam'?(pass?'✅ PROMOSSO':'❌ NON SUPERATO'):'Sessione completata';$('score').textContent=`${state.correct}/${total}`;$('resultText').textContent=`Risposte corrette: ${Math.round(state.correct/total*100)}%`;
 const by={};state.details.forEach(d=>{by[d.category]??={ok:0,n:0};by[d.category].n++;if(d.ok)by[d.category].ok++});$('categoryResults').innerHTML=Object.entries(by).map(([c,v])=>`<div class="stat"><span>${c}</span><strong>${v.ok}/${v.n}</strong></div>`).join('');
 if(state.mode==='exam'){const p=getProgress();p.exams.push({date:new Date().toISOString(),score:state.correct,total});p.exams=p.exams.slice(-20);saveProgress(p)}}
function showStats(){show('stats');const p=getProgress(),seen=Object.keys(p.seen).length,wrong=Object.values(p.wrong).filter(x=>x>0).length,last=p.exams.at(-1);$('statsBody').innerHTML=`<div class="stat"><span>Domande viste</span><strong>${seen}/${Q.length}</strong></div><div class="stat"><span>Domande da recuperare</span><strong>${wrong}</strong></div><div class="stat"><span>Esami completati</span><strong>${p.exams.length}</strong></div><div class="stat"><span>Ultimo esame</span><strong>${last?last.score+'/'+last.total:'—'}</strong></div><br><div class="progress"><span style="width:${Math.round(seen/Q.length*100)}%"></span></div><p class="center muted">${Math.round(seen/Q.length*100)}% del database visto</p>`}
function resetProgress(){if(confirm('Vuoi cancellare tutti i progressi?')){localStorage.removeItem('lptvProgress');showStats()}}
init();
</script>
</body></html>
