<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LPTV MASTER</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #edf3fb;
    color: #172033;
}

header {
    background: #0b4ea2;
    color: white;
    text-align: center;
    padding: 28px 18px;
}

header h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 10px 0 0;
    font-size: 18px;
}

main {
    max-width: 700px;
    margin: auto;
    padding: 18px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
}

button {
    width: 100%;
    padding: 16px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    font-weight: bold;
    background: #0b4ea2;
    color: white;
}

.secondary {
    background: #e6eef9;
    color: #073777;
}

.answer {
    background: #edf3fb;
    color: #172033;
    text-align: left;
    line-height: 1.4;
    border: 3px solid transparent;
}

.answer.selected {
    background: #dbeafe;
    border-color: #0b4ea2;
}

.answer.correct {
    background: #dcfce7 !important;
    color: #166534 !important;
    border-color: #15803d !important;
}

.answer.wrong {
    background: #fee2e2 !important;
    color: #991b1b !important;
    border-color: #b91c1c !important;
}

.answer:disabled {
    opacity: 1;
}

.hidden {
    display: none;
}

.translation {
    background: #fff7d6;
    padding: 14px;
    border-radius: 12px;
    margin-top: 14px;
    line-height: 1.5;
}

.feedback {
    padding: 14px;
    border-radius: 12px;
    margin-top: 14px;
    line-height: 1.5;
}

.ok {
    background: #dcfce7;
    color: #166534;
}

.bad {
    background: #fee2e2;
    color: #991b1b;
}

.solution {
    background: #eef6ff;
    border-left: 6px solid #0b4ea2;
    padding: 16px;
    border-radius: 12px;
    margin-top: 16px;
    line-height: 1.5;
}

.row {
    display: flex;
    gap: 10px;
}

.row button {
    flex: 1;
}

.counter {
    color: #5b6473;
    font-size: 17px;
}

.instruction {
    background: #fff3cd;
    color: #664d03;
    padding: 13px;
    border-radius: 12px;
    font-weight: bold;
    margin: 14px 0;
}

.option-translation {
    display: block;
    margin-top: 7px;
    font-size: 15px;
    color: #5b6473;
    font-weight: normal;
}

.small-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
    color: #0b4ea2;
}
</style>
</head>

<body>

<header>
    <h1>🚖 LPTV MASTER</h1>
    <p>English • Italiano • Quiz • Pronuncia</p>
</header>

<main>

<section id="home" class="card">

    <h2>Benvenuto Dennis 👋</h2>

    <p>
        Allenati con domande a risposta singola e multipla,
        traduzioni e spiegazioni complete.
    </p>

    <button onclick="startQuiz()">
        📝 Practice Quiz
    </button>

    <button class="secondary" onclick="showProgress()">
        📊 My Progress
    </button>

</section>

<section id="quiz" class="card hidden">

    <p id="counter" class="counter"></p>

    <div id="selectionInstruction" class="instruction"></div>

    <h2 id="question"></h2>

    <div id="questionTranslation" class="translation hidden"></div>

    <div class="row">

        <button class="secondary" onclick="toggleQuestionTranslation()">
            🇮🇹 Domanda
        </button>

        <button class="secondary" onclick="speakQuestion()">
            🔊 Ascolta
        </button>

    </div>

    <button class="secondary" onclick="toggleOptionsTranslation()">
        🇮🇹 Traduci le opzioni
    </button>

    <div id="answers"></div>

    <button id="confirmButton" onclick="confirmAnswer()">
        Conferma risposta
    </button>

    <div id="feedback" class="hidden"></div>

    <div id="solutionBox" class="solution hidden">

        <div class="small-title">
            SOLUTION AND EXPLANATION
        </div>

        <div id="correctAnswerEnglish"></div>

        <br>

        <div id="explanationEnglish"></div>

        <button class="secondary" onclick="toggleItalianExplanation()">
            🇮🇹 Traduci soluzione e spiegazione
        </button>

        <div id="italianExplanation" class="translation hidden"></div>

    </div>

    <button id="nextButton" class="hidden" onclick="nextQuestion()">
        Prossima domanda
    </button>

    <button class="secondary" onclick="goHome()">
        Esci
    </button>

</section>

<section id="result" class="card hidden">

    <h2>Risultato finale</h2>

    <p id="resultText"></p>

    <button onclick="goHome()">
        Torna alla Home
    </button>

</section>

<section id="progress" class="card hidden">

    <h2>I tuoi progressi</h2>

    <p>
        ✅ Risposte corrette:
        <b id="correctStat">0</b>
    </p>

    <p>
        ❌ Risposte errate:
        <b id="wrongStat">0</b>
    </p>

    <button onclick="goHome()">
        Torna alla Home
    </button>

</section>

</main>

<script>
const questions = [

    {
        question:
            "Your vehicle breaks down in a tunnel. What should you do?",

        questionItalian:
            "Il tuo veicolo si guasta in un tunnel. Cosa devi fare?",

        answersEnglish: [
            "Stay in your vehicle and wait for the police",
            "Stand in the lane behind your vehicle",
            "Stand in front of your vehicle",
            "Switch on hazard lights, leave safely and call for help"
        ],

        answersItalian: [
            "Rimani nel veicolo e aspetta la polizia",
            "Rimani nella corsia dietro al veicolo",
            "Mettiti davanti al veicolo",
            "Accendi le luci di emergenza, esci in sicurezza e chiama aiuto"
        ],

        correctAnswers: [3],

        explanationEnglish:
            "Switch on the hazard lights, leave the vehicle safely and call for help. Never stand in the traffic lane.",

        explanationItalian:
            "Accendi le luci di emergenza, esci dal veicolo in sicurezza e chiama aiuto. Non restare mai fermo nella corsia."
    },

    {
        question:
            "You notice a bicycle wheel sticking out between parked cars. What should you do?",

        questionItalian:
            "Noti la ruota di una bicicletta sporgere tra le auto parcheggiate. Cosa devi fare?",

        answersEnglish: [
            "Accelerate quickly",
            "Slow down and wave the cyclist across",
            "Brake sharply",
            "Slow down and be prepared to stop"
        ],

        answersItalian: [
            "Accelera rapidamente",
            "Rallenta e fai cenno al ciclista di attraversare",
            "Frena bruscamente",
            "Rallenta e preparati a fermarti"
        ],

        correctAnswers: [3],

        explanationEnglish:
            "The cyclist may suddenly emerge from between the parked vehicles. Slow down and be ready to stop.",

        explanationItalian:
            "Il ciclista potrebbe uscire improvvisamente tra le auto parcheggiate. Devi rallentare ed essere pronto a fermarti."
    },

    {
        question:
            "What should you do before moving off?",

        questionItalian:
            "Cosa devi fare prima di partire?",

        answersEnglish: [
            "Check mirrors and blind spots",
            "Sound the horn",
            "Switch on hazard lights",
            "Move immediately"
        ],

        answersItalian: [
            "Controlla gli specchi e gli angoli ciechi",
            "Suona il clacson",
            "Accendi le luci di emergenza",
            "Parti immediatamente"
        ],

        correctAnswers: [0],

        explanationEnglish:
            "Before moving off, check the mirrors and blind spots to make sure that it is safe.",

        explanationItalian:
            "Prima di partire devi controllare gli specchi e gli angoli ciechi per assicurarti che sia sicuro."
    },

    {
        question:
            "Why should you keep a safe distance?",

        questionItalian:
            "Perché devi mantenere la distanza di sicurezza?",

        answersEnglish: [
            "To save fuel only",
            "To have enough time and space to stop",
            "To prevent overtaking",
            "To drive faster"
        ],

        answersItalian: [
            "Solo per risparmiare carburante",
            "Per avere abbastanza tempo e spazio per fermarti",
            "Per impedire agli altri di sorpassare",
            "Per guidare più velocemente"
        ],

        correctAnswers: [1],

        explanationEnglish:
            "A safe distance gives you enough time and space to react and stop safely.",

        explanationItalian:
            "La distanza di sicurezza ti dà abbastanza tempo e spazio per reagire e fermarti in sicurezza."
    },

    {
        question:
            "What should you do when carrying a vulnerable passenger?",

        questionItalian:
            "Cosa devi fare quando trasporti un passeggero vulnerabile?",

        answersEnglish: [
            "Drive smoothly and offer assistance",
            "Drive faster",
            "Avoid speaking",
            "Ask the passenger to stand"
        ],

        answersItalian: [
            "Guida dolcemente e offri assistenza",
            "Guida più velocemente",
            "Evita di parlare",
            "Chiedi al passeggero di stare in piedi"
        ],

        correctAnswers: [0],

        explanationEnglish:
            "Drive smoothly and provide appropriate assistance while respecting the passenger's safety and dignity.",

        explanationItalian:
            "Devi guidare dolcemente e offrire l'assistenza adeguata, rispettando la sicurezza e la dignità del passeggero."
    },

    {
        question:
            "When overtaking a horse and rider, what should you do? Select 2 answers.",

        questionItalian:
            "Quando sorpassi un cavallo con il suo cavaliere, cosa devi fare? Seleziona 2 risposte.",

        answersEnglish: [
            "Pass slowly",
            "Leave plenty of room",
            "Sound your horn continuously",
            "Accelerate hard past the horse"
        ],

        answersItalian: [
            "Passa lentamente",
            "Lascia molto spazio",
            "Suona continuamente il clacson",
            "Accelera con forza mentre sorpassi il cavallo"
        ],

        correctAnswers: [0, 1],

        explanationEnglish:
            "Pass slowly and leave plenty of room. Horses can be frightened by noise and sudden movements.",

        explanationItalian:
            "Passa lentamente e lascia molto spazio. I cavalli possono spaventarsi per rumori e movimenti improvvisi."
    }
];

let currentQuestion = 0;
let score = 0;
let order = [];
let selectedAnswers = [];
let optionsTranslated = false;
let answerConfirmed = false;

function showSection(sectionId) {

    document.getElementById("home").classList.add("hidden");
    document.getElementById("quiz").classList.add("hidden");
    document.getElementById("result").classList.add("hidden");
    document.getElementById("progress").classList.add("hidden");

    document.getElementById(sectionId).classList.remove("hidden");
}

function createUniqueRandomOrder() {

    const indexes = questions.map((question, index) => index);

    for (let i = indexes.length - 1; i > 0; i--) {

        const randomIndex =
            Math.floor(Math.random() * (i + 1));

        const temporaryValue = indexes[i];

        indexes[i] = indexes[randomIndex];
        indexes[randomIndex] = temporaryValue;
    }

    return indexes;
}

function startQuiz() {

    order = createUniqueRandomOrder();

    currentQuestion = 0;
    score = 0;

    showSection("quiz");
    showQuestion();
}

function showQuestion() {

    const questionData =
        questions[order[currentQuestion]];

    selectedAnswers = [];
    optionsTranslated = false;
    answerConfirmed = false;

    document.getElementById("counter").textContent =
        "Domanda " +
        (currentQuestion + 1) +
        " di " +
        order.length;

    const requiredAnswers =
        questionData.correctAnswers.length;

    if (requiredAnswers === 1) {

        document.getElementById(
            "selectionInstruction"
        ).textContent =
            "Select 1 answer • Seleziona 1 risposta";

    } else {

        document.getElementById(
            "selectionInstruction"
        ).textContent =
            "Select " +
            requiredAnswers +
            " answers • Seleziona " +
            requiredAnswers +
            " risposte";
    }

    document.getElementById("question").textContent =
        questionData.question;

    document.getElementById(
        "questionTranslation"
    ).textContent =
        questionData.questionItalian;

    document.getElementById(
        "questionTranslation"
    ).classList.add("hidden");

    document.getElementById("feedback").className =
        "hidden";

    document.getElementById(
        "solutionBox"
    ).classList.add("hidden");

    document.getElementById(
        "italianExplanation"
    ).classList.add("hidden");

    document.getElementById(
        "nextButton"
    ).classList.add("hidden");

    document.getElementById(
        "confirmButton"
    ).classList.remove("hidden");

    createAnswerButtons();
}

function createAnswerButtons() {

    const questionData =
        questions[order[currentQuestion]];

    const answersBox =
        document.getElementById("answers");

    answersBox.innerHTML = "";

    questionData.answersEnglish.forEach(
        (answer, index) => {

            const button =
                document.createElement("button");

            button.className = "answer";

            if (selectedAnswers.includes(index)) {
                button.classList.add("selected");
            }

            let buttonText = answer;

            if (optionsTranslated) {

                buttonText +=
                    '<span class="option-translation">' +
                    questionData.answersItalian[index] +
                    "</span>";
            }

            button.innerHTML = buttonText;

            button.disabled = answerConfirmed;

            button.onclick = () =>
                selectAnswer(index);

            answersBox.appendChild(button);
        }
    );
}

function selectAnswer(answerIndex) {

    if (answerConfirmed) {
        return;
    }

    const questionData =
        questions[order[currentQuestion]];

    const maximumSelections =
        questionData.correctAnswers.length;

    if (selectedAnswers.includes(answerIndex)) {

        selectedAnswers =
            selectedAnswers.filter(
                index => index !== answerIndex
            );

    } else {

        if (
            selectedAnswers.length >=
            maximumSelections
        ) {

            alert(
                "Puoi selezionare solamente " +
                maximumSelections +
                (
                    maximumSelections === 1
                    ? " risposta."
                    : " risposte."
                )
            );

            return;
        }

        selectedAnswers.push(answerIndex);
    }

    createAnswerButtons();
}

function confirmAnswer() {

    const questionData =
        questions[order[currentQuestion]];

    const requiredAnswers =
        questionData.correctAnswers.length;

    if (selectedAnswers.length !== requiredAnswers) {

        alert(
            "Devi selezionare " +
            requiredAnswers +
            (
                requiredAnswers === 1
                ? " risposta."
                : " risposte."
            )
        );

        return;
    }

    answerConfirmed = true;

    const selectedSorted =
        [...selectedAnswers].sort(
            (a, b) => a - b
        );

    const correctSorted =
        [...questionData.correctAnswers].sort(
            (a, b) => a - b
        );

    const isCorrect =
        selectedSorted.length ===
        correctSorted.length &&
        selectedSorted.every(
            (value, index) =>
                value === correctSorted[index]
        );

    let statistics = JSON.parse(
        localStorage.getItem(
            "lptvStatistics"
        ) ||
        '{"correct":0,"wrong":0}'
    );

    const feedback =
        document.getElementById("feedback");

    if (isCorrect) {

        score++;
        statistics.correct++;

        feedback.className = "feedback ok";

        feedback.innerHTML =
            "<b>✅ Correct answer!</b>";

    } else {

        statistics.wrong++;

        feedback.className = "feedback bad";

        feedback.innerHTML =
            "<b>❌ Wrong answer.</b>";
    }

    localStorage.setItem(
        "lptvStatistics",
        JSON.stringify(statistics)
    );

    showAnswerColours(questionData);

    showSolution(questionData);

    document.getElementById(
        "confirmButton"
    ).classList.add("hidden");

    document.getElementById(
        "nextButton"
    ).classList.remove("hidden");
}

function showAnswerColours(questionData) {

    const answerButtons =
        document.querySelectorAll(".answer");

    answerButtons.forEach(
        (button, index) => {

            button.disabled = true;

            button.classList.remove("selected");

            if (
                questionData.correctAnswers.includes(
                    index
                )
            ) {

                button.classList.add("correct");

            } else if (
                selectedAnswers.includes(index)
            ) {

                button.classList.add("wrong");
            }
        }
    );
}

function toggleQuestionTranslation() {

    document.getElementById(
        "questionTranslation"
    ).classList.toggle("hidden");
}

function toggleOptionsTranslation() {

    optionsTranslated = !optionsTranslated;

    createAnswerButtons();

    if (answerConfirmed) {

        showAnswerColours(
            questions[order[currentQuestion]]
        );
    }
}

function showSolution(questionData) {

    const correctEnglish =
        questionData.correctAnswers
            .map(
                index =>
                    "• " +
                    questionData.answersEnglish[index]
            )
            .join("<br>");

    const correctItalian =
        questionData.correctAnswers
            .map(
                index =>
                    "• " +
                    questionData.answersItalian[index]
            )
            .join("<br>");

    document.getElementById(
        "correctAnswerEnglish"
    ).innerHTML =
        "<b>Correct answer" +
        (
            questionData.correctAnswers.length > 1
            ? "s"
            : ""
        ) +
        ":</b><br>" +
        correctEnglish;

    document.getElementById(
        "explanationEnglish"
    ).innerHTML =
        "<b>Explanation:</b><br>" +
        questionData.explanationEnglish;

    document.getElementById(
        "italianExplanation"
    ).innerHTML =
        "<b>Risposta" +
        (
            questionData.correctAnswers.length > 1
            ? "e corrette"
            : " corretta"
        ) +
        ":</b><br>" +
        correctItalian +
        "<br><br>" +
        "<b>Spiegazione:</b><br>" +
        questionData.explanationItalian;

    document.getElementById(
        "solutionBox"
    ).classList.remove("hidden");
}

function toggleItalianExplanation() {

    document.getElementById(
        "italianExplanation"
    ).classList.toggle("hidden");
}

function nextQuestion() {

    currentQuestion++;

    if (currentQuestion >= order.length) {

        const percentage =
            Math.round(
                score / order.length * 100
            );

        document.getElementById(
            "resultText"
        ).innerHTML =
            "Hai risposto correttamente a <b>" +
            score +
            " domande su " +
            order.length +
            "</b>.<br><br>" +
            "Percentuale: <b>" +
            percentage +
            "%</b>";

        showSection("result");

    } else {

        showQuestion();
    }
}

function speakQuestion() {

    const text =
        document.getElementById(
            "question"
        ).textContent;

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "en-GB";

    speechSynthesis.cancel();
    speechSynthesis.speak(speech);
}

function showProgress() {

    const statistics = JSON.parse(
        localStorage.getItem(
            "lptvStatistics"
        ) ||
        '{"correct":0,"wrong":0}'
    );

    document.getElementById(
        "correctStat"
    ).textContent =
        statistics.correct;

    document.getElementById(
        "wrongStat"
    ).textContent =
        statistics.wrong;

    showSection("progress");
}

function goHome() {

    speechSynthesis.cancel();
    showSection("home");
}
</script>

</body>
</html>
