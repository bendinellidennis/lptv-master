<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4ea2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>LPTV MASTER</title>
<style>
:root{--blue:#0b4ea2;--blue2:#07356f;--bg:#edf3fb;--card:#fff;--text:#172033;--muted:#627087;--ok:#15803d;--bad:#b91c1c;--line:#dbe5f1;--warn:#a16207}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(145deg,var(--blue),var(--blue2));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 16px;text-align:center}
header h1{margin:0;font-size:29px}header p{margin:4px 0 0;opacity:.92}
main{max-width:840px;margin:auto;padding:18px 14px calc(34px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 8px 24px #15325c18;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:16px;padding:15px 13px;background:var(--blue);color:#fff;font-size:17px;font-weight:750;cursor:pointer}
.btn.secondary{background:#e8f0fb;color:#123d7a}.btn.light{background:#f3f6fa;color:#24334b}.btn.danger{background:var(--bad)}.btn.star{background:#fff5cc;color:#7a5700}.btn:disabled{opacity:.45}
.big{font-size:20px}.muted{color:var(--muted)}.hidden{display:none!important}
.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;position:sticky;top:0;background:var(--card);padding:8px 0;z-index:3}
.badge{padding:8px 11px;border-radius:999px;background:#e8f0fb;color:#123d7a;font-weight:700}.timer{font-variant-numeric:tabular-nums;font-weight:850;font-size:20px}.timer.warn{color:var(--bad)}
.question{font-size:25px;line-height:1.26;font-weight:850;margin:16px 0}.translation{font-size:19px;line-height:1.35;background:#f3f6fa;border-radius:14px;padding:13px;margin:10px 0 16px}
.option{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#f8fafc;border-radius:15px;padding:15px;margin:10px 0;font-size:18px;color:var(--text)}
.option.selected{border-color:var(--blue);background:#e8f0fb}.option.correct{border-color:var(--ok);background:#eaf8ef}.option.wrong{border-color:var(--bad);background:#fff0f0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions .btn{flex:1;min-width:120px}
.explain{border-left:5px solid var(--blue);background:#f4f8fe;padding:14px;border-radius:12px;margin-top:16px;line-height:1.45}
.stat{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}
.progress{height:12px;background:#e3eaf3;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--blue)}
select,input{width:100%;padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:17px;margin:6px 0 12px}
.small{font-size:14px}.center{text-align:center}.review-strip{display:flex;gap:7px;overflow-x:auto;padding:7px 0 3px;margin:8px 0}.review-dot{min-width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#f7f9fc;font-weight:750}.review-dot.current{border:2px solid var(--blue)}.review-dot.answered{background:#dff2e5}.review-dot.flagged{background:#fff1b8}
.list-item{padding:13px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#eef3fa;font-size:12px;font-weight:700;color:#3c4e68}
@media(max-width:540px){.grid{grid-template-columns:1fr}.question{font-size:22px}.card{padding:17px}}
</style>
</head>
<body>
<header><h1>🚕 LPTV MASTER</h1><p>English • Italiano • Quiz • Pronuncia</p></header>
<main>
<section id="home">
  <div class="card">
    <h2>Benvenuto Dennis 👋</h2>
    <p class="muted">Versione 1.1 • Database: <strong id="count"></strong> domande</p>
    <div class="grid">
      <button class="btn big" onclick="startExam()">🎯 Esame 35 / 45 min</button>
      <button class="btn big" onclick="showStudySetup()">📚 Studio per argomento</button>
      <button class="btn secondary big" onclick="startWeak()">⚠️ Solo errori</button>
      <button class="btn secondary big" onclick="startFavorites()">⭐ Preferiti</button>
      <button class="btn secondary big" onclick="showSearch()">🔎 Cerca domanda</button>
      <button class="btn secondary big" onclick="showStats()">📊 Progressi</button>
    </div>
  </div>
  <div class="card">
    <h3>Regole dell'esame</h3>
    <div class="stat"><span>Domande</span><strong>35</strong></div>
    <div class="stat"><span>Tempo</span><strong>45 minuti</strong></div>
    <div class="stat"><span>Promozione</span><strong>30 / 35</strong></div>
    <div class="stat"><span>Domande ripetute</span><strong>Nessuna</strong></div>
  </div>
</section>

<section id="studySetup" class="hidden"><div class="card">
<div class="topline"><h2>Studio per argomento</h2><button class="btn light" onclick="goHome()">Esci</button></div>
<label>Categoria</label><select id="category"></select>
<label>Numero di domande</label><select id="studyCount"><option>10</option><option>20</option><option>35</option><option>50</option></select>
<label>Tipo di contenuto</label><select id="statusFilter"><option value="ALL">Tutto</option><option value="official">Solo ufficiali</option><option value="verified">Ufficiali + verificati</option></select>
<button class="btn" onclick="startStudy()">Inizia studio</button>
</div></section>

<section id="search" class="hidden"><div class="card">
<div class="topline"><h2>Cerca domanda</h2><button class="btn light" onclick="goHome()">Esci</button></div>
<input id="searchInput" placeholder="Es. horn, cyclist, shock..." oninput="renderSearch()">
<div id="searchResults"></div>
</div></section>

<section id="quiz" class="hidden"><div class="card">
<div class="topline"><span class="badge" id="qnum"></span><span class="timer" id="timer"></span></div>
<div class="review-strip" id="reviewStrip"></div>
<div class="small muted" id="categoryLabel"></div>
<div class="question" id="question"></div>
<div class="actions">
<button class="btn secondary" onclick="toggleTranslation()">🇮🇹 Traduzione</button>
<button class="btn secondary" onclick="speakQuestion()">🔊 Ascolta</button>
<button class="btn star" id="favBtn" onclick="toggleFavorite()">☆ Preferita</button>
<button class="btn light" id="flagBtn" onclick="toggleFlag()">🚩 Segna</button>
</div>
<div id="questionIt" class="translation hidden"></div>
<div id="selectHint" class="badge"></div>
<div id="options"></div>
<div id="explanation" class="explain hidden"></div>
<div class="actions">
<button class="btn light" onclick="exitQuiz()">Esci</button>
<button class="btn light" id="prevBtn" onclick="prevQuestion()">Indietro</button>
<button class="btn" id="confirmBtn" onclick="confirmAnswer()">Conferma</button>
<button class="btn hidden" id="nextBtn" onclick="nextQuestion()">Avanti</button>
</div>
</div></section>

<section id="result" class="hidden">
<div class="card center"><h2 id="resultTitle"></h2><div style="font-size:52px;font-weight:900" id="score"></div><p id="resultText"></p><button class="btn" onclick="goHome()">Torna alla Home</button></div>
<div class="card"><h3>Risultato per categoria</h3><div id="categoryResults"></div></div>
</section>

<section id="stats" class="hidden"><div class="card">
<div class="topline"><h2>I miei progressi</h2><button class="btn light" onclick="goHome()">Esci</button></div>
<div id="statsBody"></div><button class="btn danger" onclick="resetProgress()">Azzera progressi</button>
</div></section>
</main>
<script src="database.js"></script>
<script>
const Q=window.LPTV_QUESTIONS||[], $=id=>document.getElementById(id);
const sections=['home','studySetup','search','quiz','result','stats'];
const state={list:[],i:0,selected:new Set(),answered:false,correct:0,mode:'study',remaining:2700,interval:null,details:[],answers:{},flags:new Set()};
function show(id){sections.forEach(x=>$(x).classList.toggle('hidden',x!==id));window.scrollTo(0,0)}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function getProgress(){try{return JSON.parse(localStorage.getItem('lptvProgressV11'))||{seen:{},wrong:{},exams:[],favorites:[]}}catch{return{seen:{},wrong:{},exams:[],favorites:[]}}}
function saveProgress(p){localStorage.setItem('lptvProgressV11',JSON.stringify(p))}
function statusAllowed(q,f){const s=(q.status||'').toLowerCase();if(f==='ALL')return true;if(f==='official')return s.includes('official');return s.includes('official')||s.includes('verified')||s.includes('confirmed')}
function goHome(){clearInterval(state.interval);show('home')}
function init(){ $('count').textContent=Q.length;const cats=[...new Set(Q.map(q=>q.category))].sort();$('category').innerHTML='<option value="ALL">Tutte le categorie</option>'+cats.map(c=>`<option>${c}</option>`).join('');if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}
function showStudySetup(){show('studySetup')}
function showSearch(){show('search');$('searchInput').value='';renderSearch()}
function renderSearch(){const s=$('searchInput').value.trim().toLowerCase();const list=(s?Q.filter(q=>(q.question+' '+q.question_it+' '+q.category).toLowerCase().includes(s)):Q.slice(0,20)).slice(0,50);$('searchResults').innerHTML=list.map(q=>`<div class="list-item"><span class="pill">${q.category}</span><p><strong>${q.question}</strong></p><p class="muted">${q.question_it}</p><button class="btn secondary" onclick="startSingle('${q.id}')">Apri</button></div>`).join('')}
function startSingle(id){const q=Q.find(x=>x.id===id);if(q)begin([q],'study')}
function startStudy(){const cat=$('category').value,n=+$('studyCount').value,f=$('statusFilter').value;let pool=Q.filter(q=>(cat==='ALL'||q.category===cat)&&statusAllowed(q,f));begin(shuffle(pool).slice(0,Math.min(n,pool.length)),'study')}
function startExam(){let official=Q.filter(q=>statusAllowed(q,'verified'));if(official.length<35)official=Q;begin(shuffle(official).slice(0,35),'exam')}
function startWeak(){const p=getProgress();let pool=Q.filter(q=>(p.wrong[q.id]||0)>0);if(!pool.length)return alert('Non ci sono ancora domande sbagliate salvate.');begin(shuffle(pool).slice(0,35),'weak')}
function startFavorites(){const p=getProgress();let pool=Q.filter(q=>p.favorites.includes(q.id));if(!pool.length)return alert('Non hai ancora salvato domande preferite.');begin(shuffle(pool).slice(0,50),'favorites')}
function begin(list,mode){state.list=list;state.i=0;state.correct=0;state.mode=mode;state.details=[];state.remaining=2700;state.answers={};state.flags=new Set();show('quiz');if(mode==='exam')state.interval=setInterval(tick,1000);render()}
function tick(){state.remaining--;const m=Math.floor(state.remaining/60),s=state.remaining%60;$('timer').textContent=`${m}:${String(s).padStart(2,'0')}`;$('timer').classList.toggle('warn',state.remaining<=300);if(state.remaining<=0){clearInterval(state.interval);finish()}}
function renderStrip(){ $('reviewStrip').innerHTML=state.list.map((q,i)=>`<button class="review-dot ${i===state.i?'current':''} ${state.answers[q.id]?'answered':''} ${state.flags.has(q.id)?'flagged':''}" onclick="jumpTo(${i})">${i+1}</button>`).join('')}
function render(){const q=state.list[state.i],saved=state.answers[q.id];state.selected=new Set(saved?.selected||[]);state.answered=!!saved;$('qnum').textContent=`Domanda ${state.i+1} di ${state.list.length}`;$('timer').textContent=state.mode==='exam'?`${Math.floor(state.remaining/60)}:${String(state.remaining%60).padStart(2,'0')}`:'';$('categoryLabel').textContent=q.category+' • '+(q.status||'verificata');$('question').textContent=q.question;$('questionIt').textContent=q.question_it;$('questionIt').classList.add('hidden');$('selectHint').textContent=q.correct.length===1?'Seleziona 1 risposta':`Seleziona ${q.correct.length} risposte`;$('explanation').classList.add('hidden');$('confirmBtn').classList.toggle('hidden',!!saved);$('nextBtn').classList.toggle('hidden',!saved);$('prevBtn').disabled=state.i===0;
 const p=getProgress();$('favBtn').textContent=p.favorites.includes(q.id)?'★ Preferita':'☆ Preferita';$('flagBtn').textContent=state.flags.has(q.id)?'🚩 Segnata':'🚩 Segna';
 const order=q._order||(q._order=shuffle(q.answers.map((_,i)=>i)));$('options').innerHTML='';order.forEach(idx=>{const b=document.createElement('button');b.className='option'+(state.selected.has(idx)?' selected':'');b.dataset.idx=idx;b.innerHTML=`<strong>${String.fromCharCode(65+idx)}.</strong> <span>${q.answers[idx]}</span><span class="it hidden"><br><small>${q.answers_it[idx]||''}</small></span>`;b.onclick=()=>choose(b,idx,q.correct.length);$('options').appendChild(b)});
 if(saved)applyReview(q,saved);renderStrip()}
function choose(btn,idx,max){if(state.answered)return;if(state.selected.has(idx)){state.selected.delete(idx);btn.classList.remove('selected')}else{if(state.selected.size>=max)return;state.selected.add(idx);btn.classList.add('selected')}}
function toggleTranslation(){$('questionIt').classList.toggle('hidden');document.querySelectorAll('.option .it').forEach(x=>x.classList.toggle('hidden'))}
function speakQuestion(){const q=state.list[state.i];speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.question);u.lang='en-GB';speechSynthesis.speak(u)}
function toggleFavorite(){const q=state.list[state.i],p=getProgress(),i=p.favorites.indexOf(q.id);if(i>=0)p.favorites.splice(i,1);else p.favorites.push(q.id);saveProgress(p);render()}
function toggleFlag(){const id=state.list[state.i].id;state.flags.has(id)?state.flags.delete(id):state.flags.add(id);render()}
function confirmAnswer(){const q=state.list[state.i];if(state.selected.size!==q.correct.length)return alert(`Seleziona esattamente ${q.correct.length} ${q.correct.length===1?'risposta':'risposte'}.`);const chosen=[...state.selected].sort((a,b)=>a-b),correct=[...q.correct].sort((a,b)=>a-b),ok=JSON.stringify(chosen)===JSON.stringify(correct);state.answers[q.id]={selected:chosen,ok};state.answered=true;if(ok)state.correct++;state.details.push({id:q.id,category:q.category,ok});
 const p=getProgress();p.seen[q.id]=(p.seen[q.id]||0)+1;if(!ok)p.wrong[q.id]=(p.wrong[q.id]||0)+1;else if(p.wrong[q.id])p.wrong[q.id]=Math.max(0,p.wrong[q.id]-1);saveProgress(p);applyReview(q,state.answers[q.id]);$('confirmBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');renderStrip()}
function applyReview(q,saved){document.querySelectorAll('.option').forEach(b=>{const i=+b.dataset.idx;if(q.correct.includes(i))b.classList.add('correct');else if(saved.selected.includes(i))b.classList.add('wrong')});$('explanation').innerHTML=`<strong>${saved.ok?'✅ Risposta corretta':'❌ Risposta errata'}</strong><p>${q.explanation||''}</p><p><strong>Italiano:</strong> ${q.explanation_it||''}</p>`;$('explanation').classList.remove('hidden')}
function nextQuestion(){if(state.i<state.list.length-1){state.i++;render()}else finish()}
function prevQuestion(){if(state.i>0){state.i--;render()}}
function jumpTo(i){state.i=i;render()}
function exitQuiz(){if(confirm('Vuoi uscire dal test?'))goHome()}
function finish(){clearInterval(state.interval);show('result');const total=state.list.length,answered=Object.keys(state.answers).length,correct=Object.values(state.answers).filter(a=>a.ok).length,pass=state.mode==='exam'&&correct>=30;$('resultTitle').textContent=state.mode==='exam'?(pass?'✅ PROMOSSO':'❌ NON SUPERATO'):'Sessione completata';$('score').textContent=`${correct}/${total}`;$('resultText').textContent=`Risposte date: ${answered}/${total} • Corrette: ${Math.round(correct/total*100)}%`;
 const by={};state.details.forEach(d=>{by[d.category]??={ok:0,n:0};by[d.category].n++;if(d.ok)by[d.category].ok++});$('categoryResults').innerHTML=Object.entries(by).map(([c,v])=>`<div class="stat"><span>${c}</span><strong>${v.ok}/${v.n}</strong></div>`).join('');
 if(state.mode==='exam'){const p=getProgress();p.exams.push({date:new Date().toISOString(),score:correct,total});p.exams=p.exams.slice(-20);saveProgress(p)}}
function showStats(){show('stats');const p=getProgress(),seen=Object.keys(p.seen).length,wrong=Object.values(p.wrong).filter(x=>x>0).length,last=p.exams.at(-1);$('statsBody').innerHTML=`<div class="stat"><span>Domande viste</span><strong>${seen}/${Q.length}</strong></div><div class="stat"><span>Da recuperare</span><strong>${wrong}</strong></div><div class="stat"><span>Preferite</span><strong>${p.favorites.length}</strong></div><div class="stat"><span>Esami completati</span><strong>${p.exams.length}</strong></div><div class="stat"><span>Ultimo esame</span><strong>${last?last.score+'/'+last.total:'—'}</strong></div><br><div class="progress"><span style="width:${Math.round(seen/Q.length*100)}%"></span></div><p class="center muted">${Math.round(seen/Q.length*100)}% del database visto</p>`}
function resetProgress(){if(confirm('Vuoi cancellare tutti i progressi?')){localStorage.removeItem('lptvProgressV11');showStats()}}
init();
</script>
</body></html>
