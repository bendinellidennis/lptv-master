<style id="replay-final-ui-391269">
.replay-mobile-continue-dock{display:none}
.replay-controls-final{grid-template-columns:1fr 1fr!important}
.replay-controls-final .btn[disabled]{opacity:.45;pointer-events:none}
@media(max-width:620px){
 #screen.replay-continue-docked .wave-across-freeze .replay-phase-continue,
 #screen.replay-continue-docked .hazard-continue-button{display:none!important}
 .replay-mobile-continue-dock{display:block;position:fixed;z-index:70;left:12px;right:12px;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));pointer-events:none}
 .replay-mobile-continue-dock button{pointer-events:auto;display:flex;align-items:center;justify-content:center;gap:10px;width:min(100%,520px);min-height:56px;margin:0 auto;padding:13px 18px;border:1px solid rgba(16,53,72,.18);border-radius:17px;background:#fff;color:#123548;font-size:17px;font-weight:950;box-shadow:0 12px 32px rgba(3,25,38,.28);touch-action:manipulation;-webkit-user-select:none;user-select:none}
 .replay-mobile-continue-dock button span{font-size:22px;line-height:1}
 [data-theme="dark"] .replay-mobile-continue-dock button{background:#edf7fb;color:#0e3143}
 .replay-controls-final{grid-template-columns:1fr 1fr!important}
}

.ai-coach-review-nav{margin:12px 0 14px;border:1px solid rgba(72,92,150,.28);background:linear-gradient(145deg,#f3f5ff,#eef7f5)}
.ai-coach-review-nav h3{margin:8px 0 4px}.ai-coach-review-nav p{margin:0 0 10px}.ai-coach-review-nav .actions{display:grid;grid-template-columns:auto 1fr;gap:8px}.ai-coach-review-nav button[disabled]{opacity:.45;pointer-events:none}
[data-theme="dark"] .ai-coach-review-nav{background:#232d43;border-color:#526487}

.exam-day-ai-recovery{margin:14px 0;display:grid;gap:12px;border:1px solid rgba(72,92,150,.28);background:linear-gradient(145deg,#f3f5ff,#eef7f5)}
.exam-day-ai-recovery .exam-day-ai-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.exam-day-ai-recovery .exam-day-ai-head>span,.exam-day-ai-recovery>span{font-size:28px;line-height:1}
.exam-day-ai-recovery h3{margin:0 0 5px}.exam-day-ai-recovery p{margin:0;color:var(--muted,#667085)}
.exam-day-ai-recovery .exam-day-ai-head>strong{min-width:38px;height:38px;border-radius:999px;display:grid;place-items:center;background:#173d5c;color:#fff}
.exam-day-ai-recovery.clean{grid-template-columns:auto 1fr;align-items:center;background:linear-gradient(145deg,#effaf2,#f6fbff)}
.exam-day-ai-recovery.empty{grid-template-columns:auto 1fr;align-items:center}
[data-theme="dark"] .exam-day-ai-recovery{background:#232d43;border-color:#526487}
