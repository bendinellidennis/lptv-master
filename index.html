 #screen.replay-continue-docked .hazard-continue-button{display:none!important}
 .replay-mobile-continue-dock{display:block;position:fixed;z-index:70;left:12px;right:12px;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));pointer-events:none}

.exam-day-ai-recovery .exam-day-ai-head>span,.exam-day-ai-recovery>span{font-size:28px;line-height:1}

.exam-day-ai-recovery.empty{grid-template-columns:auto 1fr;align-items:center}
[data-theme="dark"] .exam-day-ai-recovery{background:#232d43;border-color:#526487}

.ai-priority-recovery{margin:14px 0;border:1px solid rgba(31,91,117,.20);background:linear-gradient(145deg,#fff7e8,#eef8ff);display:grid;gap:14px}
.ai-priority-recovery.empty{grid-template-columns:auto 1fr;align-items:center}.ai-priority-recovery.empty>span{font-size:30px}
.ai-priority-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}.ai-priority-head>span{font-size:30px}.ai-priority-head small{font-weight:900;letter-spacing:.08em;color:#a35b00}.ai-priority-head h3{margin:3px 0 5px}.ai-priority-head p{margin:0;color:var(--muted,#667085)}.ai-priority-head>strong{min-width:40px;height:40px;border-radius:999px;background:#0d4567;color:#fff;display:grid;place-items:center}
.ai-priority-topics{display:grid;gap:9px}.ai-priority-topic{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}.ai-priority-topic>span{font-weight:750}.ai-priority-topic>strong{font-size:13px}.ai-priority-topic>i{grid-column:1/-1;height:7px;background:rgba(13,69,103,.10);border-radius:99px;overflow:hidden}.ai-priority-topic>i>b{display:block;height:100%;background:#1f8aa5;border-radius:99px}
.ai-priority-questions{display:grid;gap:7px}.ai-priority-questions>small{font-weight:850;color:var(--muted,#667085)}.ai-priority-questions button{border:1px solid rgba(13,69,103,.14);border-radius:14px;background:rgba(255,255,255,.72);padding:10px 12px;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:10px;color:inherit}.ai-priority-questions button strong{color:#0d4567}.ai-priority-questions button span{font-size:13px;line-height:1.35}
