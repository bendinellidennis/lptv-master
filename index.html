<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4ea2">
<link rel="manifest" href="manifest.webmanifest">
<title>LPTV MASTER</title>
<style>
:root{--blue:#0b4ea2;--blue2:#07356f;--bg:#edf3fb;--card:#fff;--text:#172033;--muted:#667085;--line:#d8e2ef;--ok:#16803c;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:linear-gradient(145deg,var(--blue),var(--blue2));color:white;text-align:center;padding:calc(16px + env(safe-area-inset-top)) 16px 18px}
header h1{margin:0;font-size:30px}header p{margin:5px 0 0;opacity:.9}
main{max-width:820px;margin:auto;padding:16px 14px calc(34px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 7px 20px #15325c18;margin-bottom:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.btn{border:0;border-radius:15px;padding:15px 12px;font-size:17px;font-weight:750;background:var(--blue);color:#fff}
.btn.secondary{background:#e9f0fa;color:#123d7a}.btn.light{background:#f4f6f9;color:#26364d}.btn:disabled{opacity:.4}
.hidden{display:none!important}.muted{color:var(--muted)}.big{font-size:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}
.badge{display:inline-block;background:#e9f0fa;color:#123d7a;border-radius:999px;padding:7px 10px;font-weight:700}
.timer{font-size:21px;font-weight:850;font-variant-numeric:tabular-nums}.timer.warn{color:var(--bad)}
.progress{height:11px;background:#e5ebf3;border-radius:999px;overflow:hidden;margin-bottom:12px}.progress span{display:block;height:100%;background:var(--blue)}
.question{font-size:24px;line-height:1.27;font-weight:850;margin:16px 0}.translation{background:#f3f6fa;border-radius:13px;padding:13px;font-size:18px;line-height:1.35;margin:10px 0}
.option{width:100%;text-align:left;border:2px solid var(--line);background:#f9fbfd;border-radius:14px;padding:14px;margin:9px 0;font-size:17px;color:var(--text)}
.option.selected{border-color:var(--blue);background:#e9f0fa}.option.correct{border-color:var(--ok);background:#ebf8ef}.option.wrong{border-color:var(--bad);background:#fff0ee}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.actions .btn{flex:1;min-width:120px}
.explain{border-left:5px solid var(--blue);background:#f4f8fe;padding:14px;border-radius:12px;margin-top:14px;line-height:1.45}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}.stat:last-child{border-bottom:0}
select{width:100%;font-size:17px;padding:13px;border:1px solid var(--line);border-radius:12px;background:white;margin:6px 0 13px}
.center{text-align:center}
@media(max-width:560px){.grid{grid-template-columns:1fr}.question{font-size:22px}}
</style>
</head>
<body>
<header><h1>🚕 LPTV MASTER</h1><p>REBUILD STABLE • English + Italiano</p></header>
<main>
<section id="home">
  <div class="card">
    <h2>Benvenuto Dennis 👋</h2>
    <p class="muted">Versione stabile • <strong id="dbCount"></strong> domande reali</p>
    <div class="grid">
      <button class="btn big" onclick="startExam()">🎯 Esame 35 / 45 min</button>
      <button class="btn big" onclick="showStudy()">📚 Studio per argomento</button>
      <button class="btn secondary big" onclick="startWrong()">⚠️ Solo errori</button>
      <button class="btn secondary big" onclick="showStats()">📊 Progressi</button>
    </div>
  </div>
  <div class="card">
    <h3>Regole</h3>
    <div class="stat"><span>Domande</span><strong>35</strong></div>
    <div class="stat"><span>Tempo</span><strong>45 minuti</strong></div>
    <div class="stat"><span>Promozione</span><strong>30/35</strong></div>
    <div class="stat"><span>Ripetizioni nello stesso test</span><strong>Nessuna</strong></div>
  </div>
</section>

<section id="study" class="hidden">
  <div class="card">
    <div class="top"><h2>Studio</h2><button class="btn light" onclick="goHome()">Esci</button></div>
    <label>Categoria</label><select id="category"></select>
    <label>Numero di domande</label>
    <select id="studyCount"><option>10</option><option>20</option><option>35</option><option>50</option></select>
    <button class="btn" onclick="startStudy()">Inizia</button>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="card">
    <div class="top"><span class="badge" id="qNumber"></span><span class="timer" id="timer"></span></div>
    <div class="progress"><span id="bar" style="width:0%"></span></div>
    <div class="muted" id="meta"></div>
    <div class="question" id="question"></div>
    <div class="actions">
      <button class="btn secondary" onclick="toggleItalian()">🇮🇹 Traduzione</button>
      <button class="btn secondary" onclick="speak()">🔊 Ascolta</button>
    </div>
    <div class="translation hidden" id="italian"></div>
    <p><span class="badge" id="hint"></span></p>
    <div id="options"></div>
    <div class="explain hidden" id="explanation"></div>
    <div class="actions">
      <button class="btn light" onclick="exitQuiz()">Esci</button>
      <button class="btn" id="confirmBtn" onclick="confirmAnswer()">Conferma</button>
      <button class="btn hidden" id="nextBtn" onclick="nextQuestion()">Avanti</button>
    </div>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card center">
    <h2 id="resultTitle"></h2>
    <div id="score" style="font-size:52px;font-weight:900"></div>
    <p id="resultText"></p>
    <button class="btn" onclick="goHome()">Torna alla Home</button>
  </div>
  <div class="card"><h3>Risultato per categoria</h3><div id="categoryResult"></div></div>
</section>

<section id="stats" class="hidden">
  <div class="card">
    <div class="top"><h2>Progressi</h2><button class="btn light" onclick="goHome()">Esci</button></div>
    <div id="statsBody"></div>
  </div>
</section>
</main>

<script src="database.js"></script>
<script>
'use strict';

const Q = Array.isArray(window.LPTV_QUESTIONS) ? window.LPTV_QUESTIONS : [];
const $ = id => document.getElementById(id);
const sections = ['home','study','quiz','result','stats'];
const STORAGE = 'lptvStableProgress1';

const state = {
  list: [],
  index: 0,
  mode: 'study',
  selected: new Set(),
  answered: false,
  answers: {},
  remaining: 2700,
  timerId: null
};

function show(name){
  sections.forEach(id => $(id).classList.toggle('hidden', id !== name));
  window.scrollTo(0,0);
}

function shuffle(items){
  const a = [...items];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function progress(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE)) || {seen:{},wrong:{},correct:{},exams:[]};
  }catch{
    return {seen:{},wrong:{},correct:{},exams:[]};
  }
}

function saveProgress(p){
  localStorage.setItem(STORAGE, JSON.stringify(p));
}

function init(){
  $('dbCount').textContent = Q.length;
  const categories = [...new Set(Q.map(q=>q.category))].sort();
  $('category').innerHTML =
    '<option value="ALL">Tutte le categorie</option>' +
    categories.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
}

function escapeHtml(value){
  return String(value).replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  })[ch]);
}

function goHome(){
  clearInterval(state.timerId);
  show('home');
}

function showStudy(){
  show('study');
}

function startStudy(){
  const category = $('category').value;
  const count = Number($('studyCount').value);
  const pool = category === 'ALL' ? Q : Q.filter(q=>q.category===category);
  begin(shuffle(pool).slice(0,Math.min(count,pool.length)), 'study');
}

function startExam(){
  begin(shuffle(Q).slice(0,Math.min(35,Q.length)), 'exam');
}

function startWrong(){
  const p = progress();
  const pool = Q.filter(q => (p.wrong[q.id] || 0) > 0);
  if(!pool.length){
    alert('Non ci sono ancora domande sbagliate salvate.');
    return;
  }
  begin(shuffle(pool).slice(0,Math.min(35,pool.length)), 'wrong');
}

function begin(list, mode){
  clearInterval(state.timerId);
  state.list = list;
  state.index = 0;
  state.mode = mode;
  state.answers = {};
  state.remaining = 2700;
  show('quiz');
  if(mode === 'exam'){
    state.timerId = setInterval(tick,1000);
  }
  render();
}

function tick(){
  state.remaining--;
  $('timer').textContent = formatTime(state.remaining);
  $('timer').classList.toggle('warn',state.remaining <= 300);
  if(state.remaining <= 0){
    clearInterval(state.timerId);
    finish();
  }
}

function formatTime(seconds){
  const m = Math.floor(seconds/60);
  const s = seconds%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

function render(){
  const q = state.list[state.index];
  if(!q){ finish(); return; }

  const saved = state.answers[q.id];
  state.selected = new Set(saved ? saved.selected : []);
  state.answered = Boolean(saved);

  $('qNumber').textContent = `Domanda ${state.index+1} di ${state.list.length}`;
  $('timer').textContent = state.mode === 'exam' ? formatTime(state.remaining) : '';
  $('bar').style.width = `${Math.round((state.index+1)/state.list.length*100)}%`;
  $('meta').textContent = `${q.category} • ${q.status || 'verificata'} • ${q.id}`;
  $('question').textContent = q.question;
  $('italian').textContent = q.question_it;
  $('italian').classList.add('hidden');
  $('hint').textContent = q.correct.length === 1 ? 'Seleziona 1 risposta' : `Seleziona ${q.correct.length} risposte`;
  $('explanation').classList.add('hidden');
  $('confirmBtn').classList.toggle('hidden', state.answered);
  $('nextBtn').classList.toggle('hidden', !state.answered);

  const order = q._order || (q._order = shuffle(q.answers.map((_,i)=>i)));
  $('options').innerHTML = '';

  order.forEach(index=>{
    const button = document.createElement('button');
    button.className = 'option' + (state.selected.has(index) ? ' selected' : '');
    button.dataset.index = index;
    button.innerHTML =
      `<strong>${String.fromCharCode(65+index)}.</strong> ${escapeHtml(q.answers[index])}` +
      `<div class="muted hidden it-option">${escapeHtml(q.answers_it[index] || '')}</div>`;
    button.addEventListener('click', ()=>selectOption(button,index,q.correct.length));
    $('options').appendChild(button);
  });

  if(saved && state.mode !== 'exam'){
    reveal(q,saved);
  }
}

function selectOption(button,index,max){
  if(state.answered) return;

  if(state.selected.has(index)){
    state.selected.delete(index);
    button.classList.remove('selected');
  }else{
    if(state.selected.size >= max) return;
    state.selected.add(index);
    button.classList.add('selected');
  }
}

function toggleItalian(){
  $('italian').classList.toggle('hidden');
  document.querySelectorAll('.it-option').forEach(x=>x.classList.toggle('hidden'));
}

function speak(){
  const q = state.list[state.index];
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(q.question);
  utterance.lang = 'en-GB';
  utterance.rate = 0.9;
  speechSynthesis.speak(utterance);
}

function confirmAnswer(){
  const q = state.list[state.index];

  if(state.selected.size !== q.correct.length){
    alert(`Seleziona esattamente ${q.correct.length} ${q.correct.length===1?'risposta':'risposte'}.`);
    return;
  }

  const chosen = [...state.selected].sort((a,b)=>a-b);
  const correct = [...q.correct].sort((a,b)=>a-b);
  const ok = JSON.stringify(chosen) === JSON.stringify(correct);

  state.answers[q.id] = {selected:chosen,ok};
  state.answered = true;

  const p = progress();
  p.seen[q.id] = (p.seen[q.id] || 0) + 1;
  if(ok){
    p.correct[q.id] = (p.correct[q.id] || 0) + 1;
  }else{
    p.wrong[q.id] = (p.wrong[q.id] || 0) + 1;
  }
  saveProgress(p);

  $('confirmBtn').classList.add('hidden');
  $('nextBtn').classList.remove('hidden');

  if(state.mode !== 'exam'){
    reveal(q,state.answers[q.id]);
  }
}

function reveal(q,saved){
  document.querySelectorAll('.option').forEach(button=>{
    const index = Number(button.dataset.index);
    if(q.correct.includes(index)){
      button.classList.add('correct');
    }else if(saved.selected.includes(index)){
      button.classList.add('wrong');
    }
  });

  const correctText = q.correct.map(i=>q.answers[i]).join(' • ');
  $('explanation').innerHTML =
    `<strong>${saved.ok?'✅ Risposta corretta':'❌ Risposta errata'}</strong>` +
    `<p><strong>Corretta:</strong> ${escapeHtml(correctText)}</p>` +
    `<p>${escapeHtml(q.explanation || '')}</p>` +
    `<p><strong>Italiano:</strong> ${escapeHtml(q.explanation_it || '')}</p>`;
  $('explanation').classList.remove('hidden');
}

function nextQuestion(){
  if(state.index < state.list.length-1){
    state.index++;
    render();
  }else{
    finish();
  }
}

function exitQuiz(){
  if(confirm('Vuoi uscire dal test?')){
    goHome();
  }
}

function finish(){
  clearInterval(state.timerId);
  show('result');

  const total = state.list.length;
  const answered = Object.keys(state.answers).length;
  const correct = Object.values(state.answers).filter(a=>a.ok).length;
  const pass = state.mode === 'exam' && correct >= 30;

  $('resultTitle').textContent =
    state.mode === 'exam' ? (pass ? '✅ PROMOSSO' : '❌ NON SUPERATO') : 'Sessione completata';
  $('score').textContent = `${correct}/${total}`;
  $('resultText').textContent = `Risposte date: ${answered}/${total}`;

  const byCategory = {};
  state.list.forEach(q=>{
    const a = state.answers[q.id];
    byCategory[q.category] ||= {correct:0,total:0};
    byCategory[q.category].total++;
    if(a && a.ok) byCategory[q.category].correct++;
  });

  $('categoryResult').innerHTML = Object.entries(byCategory)
    .map(([name,value])=>`<div class="stat"><span>${escapeHtml(name)}</span><strong>${value.correct}/${value.total}</strong></div>`)
    .join('');

  if(state.mode === 'exam'){
    const p = progress();
    p.exams.push({date:new Date().toISOString(),score:correct,total});
    p.exams = p.exams.slice(-20);
    saveProgress(p);
  }
}

function showStats(){
  show('stats');
  const p = progress();
  const seen = Object.keys(p.seen).length;
  const wrong = Object.values(p.wrong).filter(v=>v>0).length;
  const last = p.exams.length ? p.exams[p.exams.length-1] : null;

  $('statsBody').innerHTML =
    `<div class="stat"><span>Domande viste</span><strong>${seen}/${Q.length}</strong></div>` +
    `<div class="stat"><span>Domande sbagliate</span><strong>${wrong}</strong></div>` +
    `<div class="stat"><span>Esami completati</span><strong>${p.exams.length}</strong></div>` +
    `<div class="stat"><span>Ultimo esame</span><strong>${last?last.score+'/'+last.total:'—'}</strong></div>`;
}

init();
</script>
</body>
</html>
