 <section class="head"><small>MDM PROOFLOOP · 45.8.38.23.4</small><h1 id="pageTitle">🔄 Student Evidence</h1><p id="pageSub">Missions, evidence and human review.</p></section>
 <section class="card"><h2 id="assignTitle">Assign verification mission</h2><div class="grid two"><div class="field"><label id="studentLabel" for="studentSelect">Student</label><select id="studentSelect" disabled><option id="studentLoading">Loading…</option></select></div><div class="field"><label id="typeLabel" for="missionType">Mission type</label><select id="missionType"><option id="typeVerification" value="verification">Verification</option><option id="typePractical" value="practical_verification">Practical verification</option><option id="typeTheory" value="theory_recovery">Theory recovery</option></select></div></div><div class="field" style="margin-top:10px"><label id="objectiveLabel" for="objective">Objective</label><textarea id="objective" maxlength="500"></textarea></div><button class="btn" id="assignBtn" type="button" disabled style="margin-top:10px">＋ Assign</button><div class="status" id="status">Connecting to server…</div></section>

<script src="mdm-backend-config-45831341.js?v=45838234-evidence-page"></script>
<script>
(function(){'use strict';const VERSION='45.8.38.23.4';const $=id=>document.getElementById(id);function parse(v){try{return v?JSON.parse(v):null}catch(_){return null}}function lang(){try{const l=String(parse(localStorage.getItem('mdm-v1-settings'))?.lang||'en').toLowerCase();return ['it','en','mt'].includes(l)?l:'en'}catch(_){return'en'}}function t(it,en,mt){return lang()==='it'?it:lang()==='mt'?mt:en}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function session(){for(const k of ['mdm_auth_session_v4410','mdm_auth_session_v1','mdm-auth-session']){const s=parse(localStorage.getItem(k));if((s?.accessToken||s?.access_token)&&s?.user?.id)return s}return window.MDM_AUTH_SESSION||window.mdmAuthSession||{}}function token(){const s=session();return s.accessToken||s.access_token||s.session?.access_token||''}function cfg(){const c=window.MDM_BACKEND_CONFIG||window.MDM_BACKEND||{};const endpoint=c.endpoint||c.url||c.supabaseUrl,key=c.publishableKey||c.anonKey||c.key;if(!endpoint||!key)throw new Error('backend_config_unavailable');return{endpoint:String(endpoint).replace(/\/$/,''),key:String(key)}}async function rpc(name,payload){const c=cfg(),tk=token();if(!tk)throw new Error('authentication_required');const r=await fetch(c.endpoint+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':c.key,'Authorization':'Bearer '+tk},body:JSON.stringify(payload||{}),cache:'no-store'});const tx=await r.text();let d={};try{d=tx?JSON.parse(tx):{}}catch(_){}if(Array.isArray(d))d=d[0]||{};if(!r.ok)throw new Error(String(d?.message||d?.error||('http_'+r.status)));return d||{}}
function localize(){document.documentElement.lang=lang();document.title=t('Malta Driving Master · Evidenze studenti','Malta Driving Master · Student Evidence','Malta Driving Master · Evidenza tal-istudenti');$('pageTitle').textContent='🔄 '+t('Evidenze studenti','Student Evidence','Evidenza tal-istudenti');$('pageSub').textContent=t('Missioni, prove e verifica umana.','Missions, evidence and human review.','Missjonijiet, evidenza u verifika umana.');$('assignTitle').textContent=t('Assegna missione di verifica','Assign verification mission','Assenja missjoni ta’ verifika');$('studentLabel').textContent=t('Studente','Student','Student');$('typeLabel').textContent=t('Tipo missione','Mission type','Tip ta’ missjoni');$('typeVerification').textContent=t('Verifica','Verification','Verifika');$('typePractical').textContent=t('Verifica pratica','Practical verification','Verifika prattika');$('typeTheory').textContent=t('Recupero teoria','Theory recovery','Irkupru tat-teorija');$('objectiveLabel').textContent=t('Obiettivo','Objective','Għan');$('objective').placeholder=t('Descrivi ciò che deve essere verificato','Describe what must be verified','Iddeskrivi x’għandu jiġi vverifikat');$('assignBtn').textContent='＋ '+t('Assegna','Assign','Assenja');$('reviewTitle').textContent=t('Evidenze da verificare','Evidence awaiting review','Evidenza għar-reviżjoni');$('missionsTitle').textContent=t('Missioni recenti','Recent missions','Missjonijiet riċenti');$('foot').textContent=t('Solo verifica umana · Nessuna certificazione pratica automatica','Human review only · No automatic practical certification','Verifika umana biss · Ebda ċertifikazzjoni prattika awtomatika');for(const id of ['studentLoading','reviewLoading','missionsLoading']){const el=$(id);if(el)el.textContent=t('Caricamento…','Loading…','Qed jitgħabba…')}}function setStatus(text,kind){$('status').textContent=text;$('status').className='status'+(kind?' '+kind:'')}function studentName(s){return s.student_name||s.student_email||t('Studente','Student','Student')}function renderStudents(students){const sel=$('studentSelect');if(!students.length){sel.innerHTML='<option value="">'+esc(t('Nessuno studente attivo','No active students','L-ebda student attiv'))+'</option>';sel.disabled=true;$('assignBtn').disabled=true;return}sel.innerHTML=students.map(s=>'<option value="'+esc(s.student_user_id)+'">'+esc(studentName(s))+'</option>').join('');sel.disabled=false;$('assignBtn').disabled=false}function missionTitle(m){return m?.payload?.title||m?.payload?.objective||t('Missione','Mission','Missjoni')}function missionStatus(m){const s=String(m?.status||''),map={assigned:['Assegnata','Assigned','Assenjata'],evidence_submitted:['Prova inviata','Evidence submitted','Evidenza mibgħuta'],accepted:['Accettata','Accepted','Aċċettata'],revision_requested:['Nuova prova richiesta','Revision requested','Evidenza ġdida mitluba'],cancelled:['Annullata','Cancelled','Ikkanċellata']},v=map[s];return v?t(v[0],v[1],v[2]):t('Stato non disponibile','Status unavailable','Status mhux disponibbli')}function errorText(code){const c=String(code||'').toLowerCase();if(c.includes('school_not_authorized'))return t('La scuola non è ancora autorizzata a usare il backend delle evidenze.','The school is not yet authorized to use the evidence backend.','L-iskola għadha mhix awtorizzata tuża l-backend tal-evidenza.');if(c.includes('authentication_required'))return t('Accesso richiesto. Rientra nell’account scuola.','Sign-in required. Sign in again with the school account.','Huwa meħtieġ id-dħul. Erġa’ idħol bil-kont tal-iskola.');if(c.includes('backend_config_unavailable'))return t('Configurazione del backend non disponibile.','Backend configuration unavailable.','Il-konfigurazzjoni tal-backend mhix disponibbli.');return t('Backend evidenze temporaneamente non disponibile.','Evidence backend is temporarily unavailable.','Il-backend tal-evidenza temporanjament mhux disponibbli.')}function renderMissions(missions){const host=$('missionsList');if(!missions.length){host.innerHTML='<p class="empty">'+esc(t('Nessuna missione.','No missions.','L-ebda missjoni.'))+'</p>';return}host.innerHTML=missions.slice(0,20).map(m=>'<article class="item"><div class="item-head"><h3>'+esc(missionTitle(m))+'</h3><span class="pill">'+esc(missionStatus(m))+'</span></div><p>'+esc(m.student_evidence?.summary||m.evidence?.summary||t('Nessuna evidenza allegata.','No evidence attached.','L-ebda evidenza mehmuża.'))+'</p></article>').join('')}function renderReviews(missions){const pending=missions.filter(m=>m.status==='evidence_submitted'),host=$('reviewList');if(!pending.length){host.innerHTML='<p class="empty">'+esc(t('Nessuna evidenza in attesa.','No evidence awaiting review.','L-ebda evidenza qed tistenna reviżjoni.'))+'</p>';return}host.innerHTML=pending.map(m=>'<article class="item" data-mid="'+esc(m.mission_id)+'"><div class="item-head"><h3>'+esc(missionTitle(m))+'</h3><span class="pill">'+esc(t('DA VERIFICARE','AWAITING REVIEW','GĦAR-REVIŻJONI'))+'</span></div><p>'+esc(m.student_evidence?.summary||m.evidence?.summary||t('Evidenza ricevuta.','Evidence received.','Evidenza riċevuta.'))+'</p><div class="actions"><button class="btn" data-decision="accepted">✓ '+esc(t('Accetta','Accept','Aċċetta'))+'</button><button class="btn secondary" data-decision="revision_requested">↺ '+esc(t('Richiedi nuova prova','Request new evidence','Itlob evidenza ġdida'))+'</button></div></article>').join('');host.querySelectorAll('[data-decision]').forEach(btn=>btn.onclick=()=>review(btn))}async function review(btn){const id=btn.closest('[data-mid]')?.dataset.mid;if(!id)return;btn.disabled=true;try{await rpc('mdm_school_review_mission_evidence',{p_mission_id:id,p_decision:btn.dataset.decision,p_review:{source:'school-evidence-page',human:true,version:VERSION}});setStatus(t('Verifica salvata.','Review saved.','Ir-reviżjoni ġiet salvata.'),'ok');await load()}catch(e){setStatus('⚠️ '+errorText(e.message||e),'warn')}finally{btn.disabled=false}}async function assign(){const student=$('studentSelect').value,objective=String($('objective').value||'').trim(),type=$('missionType').value;if(!student||!objective){setStatus(t('Seleziona uno studente e inserisci un obiettivo.','Select a student and enter an objective.','Agħżel student u daħħal għan.'),'warn');return}const btn=$('assignBtn');btn.disabled=true;try{await rpc('mdm_school_assign_mission',{p_student_user_id:student,p_payload:{title:objective,objective,source:'school-evidence-page',schema:'mdm-evidence-flow-ui-v2',version:VERSION},p_mission_type:type});$('objective').value='';setStatus(t('Missione assegnata.','Mission assigned.','Missjoni assenjata.'),'ok');await load()}catch(e){setStatus('⚠️ '+errorText(e.message||e),'warn')}finally{btn.disabled=false}}async function load(){try{setStatus(t('Connessione al server…','Connecting to server…','Konnessjoni mas-server…'));const[a,m]=await Promise.all([rpc('mdm_school_list_active_students',{}),rpc('mdm_school_list_student_missions',{p_student_user_id:null})]);if(a.authorized!==true||m.authorized!==true)throw new Error('school_not_authorized');const students=Array.isArray(a.students)?a.students:[],missions=Array.isArray(m.missions)?m.missions:[];renderStudents(students);renderReviews(missions);renderMissions(missions);setStatus(t('Connesso. Dati aggiornati.','Connected. Data updated.','Konness. Data aġġornata.'),'ok')}catch(e){renderStudents([]);$('reviewList').innerHTML='<p class="empty">—</p>';$('missionsList').innerHTML='<p class="empty">—</p>';setStatus('⚠️ '+errorText(e.message||e),'warn')}}function exitEvidence(){if(history.length>1){history.back();return}location.replace('./')}$('backBtn').onclick=exitEvidence;$('brandBtn').onclick=exitEvidence;$('homeBtn').onclick=exitEvidence;$('assignBtn').onclick=assign;localize();load()})();
</script>
