<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>Malta Driving Master · Evidenze studenti</title>
<style>
:root{color-scheme:light;--bg:#eef5f7;--ink:#103446;--muted:#637983;--line:#d8e5e9;--card:#fff;--accent:#0b6980;--warn:#fff6da;--warnline:#e3bd52;--ok:#eaf8ef;--okline:#78bb8b}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}body{padding:0 0 env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}
/* Header MDM standard scuola: stesso linguaggio visivo della testata reale */
.mdm-header{position:sticky;top:0;z-index:60;background:linear-gradient(135deg,#061c31,#07354e);color:#fff;padding-top:env(safe-area-inset-top);box-shadow:0 1px 0 rgba(62,192,214,.22)}
.mdm-header-inner{min-height:108px;padding:14px 16px;display:grid;grid-template-columns:58px minmax(0,1fr) 58px 58px;gap:12px;align-items:center;max-width:760px;margin:0 auto}
.mdm-hbtn{width:58px;height:58px;border-radius:18px;border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.075);color:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);padding:0}
.mdm-back{font-size:39px;line-height:1;font-weight:700;padding-bottom:4px}.mdm-lang{font-size:17px;font-weight:900}.mdm-person{font-size:0}.mdm-person svg{width:33px;height:33px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mdm-brand{min-width:0;border:0;background:transparent;color:#fff;display:flex;align-items:center;gap:11px;text-align:left;padding:0}.mdm-logo{width:48px;height:48px;flex:0 0 48px}.mdm-title{font-size:23px;font-weight:900;line-height:1.04;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrap{width:min(760px,100%);margin:0 auto;padding:16px}.head{background:linear-gradient(145deg,#073a55,#0c536c);color:#fff;padding:18px;border-radius:22px;box-shadow:0 12px 28px rgba(7,49,70,.15)}.head small{opacity:.78;font-weight:800;letter-spacing:.05em}.head h1{font-size:24px;margin:7px 0 5px}.head p{margin:0;opacity:.88}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 8px 22px rgba(20,60,80,.06)}.card h2{font-size:18px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr;gap:10px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:800;color:var(--muted)}select,input,textarea{width:100%;border:1px solid #cddde2;background:#fff;border-radius:13px;padding:12px;color:var(--ink)}textarea{min-height:88px;resize:vertical}.btn{border:0;border-radius:13px;padding:12px 14px;background:var(--accent);color:#fff;font-weight:800}.btn:disabled{opacity:.48}.status{padding:12px 13px;border-radius:14px;background:#eef4f6;color:var(--ink);font-size:13px;margin-top:12px}.status.warn{background:var(--warn);border:1px solid var(--warnline)}.status.ok{background:var(--ok);border:1px solid var(--okline)}.list{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:16px;padding:13px}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item h3{font-size:15px;margin:0}.item p{color:var(--muted);font-size:13px}.pill{font-size:10px;font-weight:900;background:#edf4f6;border-radius:999px;padding:5px 8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#e8f1f4;color:var(--ink)}.empty{color:var(--muted);font-size:13px}.foot{text-align:center;color:var(--muted);font-size:11px;padding:18px 6px 8px}@media(min-width:620px){.grid.two{grid-template-columns:1fr 1fr}}@media(max-width:430px){.mdm-header-inner{grid-template-columns:52px minmax(0,1fr) 52px 52px;gap:8px;padding-left:12px;padding-right:12px}.mdm-hbtn{width:52px;height:52px;border-radius:17px}.mdm-logo{width:43px;height:43px;flex-basis:43px}.mdm-title{font-size:20px}}
</style>
</head>
<body>
<header class="mdm-header">
 <div class="mdm-header-inner">
  <button class="mdm-hbtn mdm-back" id="backBtn" type="button" aria-label="Indietro">‹</button>
  <button class="mdm-brand" id="brandBtn" type="button" aria-label="Malta Driving Master">
   <svg class="mdm-logo" viewBox="0 0 64 64" aria-hidden="true"><path fill="#f3dfae" d="M11 39c6-13 15-20 26-20 7 0 12 3 16 8-6 1-11 4-14 9-4 6-10 9-18 9-4 0-7-2-10-6Z"/><path fill="#f3dfae" d="M33 48c5-2 9-5 12-9 2-3 5-5 9-6-1 9-7 16-16 19l-5-4Z"/><path stroke="#31d1df" stroke-width="4" stroke-linecap="round" d="M9 53h46"/></svg>
   <strong class="mdm-title">Malta Driving Master</strong>
  </button>
  <button class="mdm-hbtn mdm-person" id="accountBtn" type="button" aria-label="Account scuola"><svg viewBox="0 0 48 48"><circle cx="28" cy="14" r="7"/><path d="M16 38c1-9 6-14 12-14s11 5 12 14"/><path d="M9 12v12M3 18h12"/></svg></button>
  <button class="mdm-hbtn mdm-lang" id="langBtn" type="button" aria-label="Lingua">IT</button>
 </div>
</header>
<main class="wrap">
 <section class="head"><small>MDM PROOFLOOP · 45.8.38.23.5</small><h1 id="pageTitle"></h1><p id="pageSub"></p></section>
 <section class="card"><h2 id="assignTitle"></h2><div class="grid two"><div class="field"><label id="studentLabel" for="studentSelect"></label><select id="studentSelect" disabled></select></div><div class="field"><label id="typeLabel" for="missionType"></label><select id="missionType"><option id="typeVerification" value="verification"></option><option id="typePractical" value="practical_verification"></option><option id="typeTheory" value="theory_recovery"></option></select></div></div><div class="field" style="margin-top:10px"><label id="objectiveLabel" for="objective"></label><textarea id="objective" maxlength="500"></textarea></div><button class="btn" id="assignBtn" type="button" disabled style="margin-top:10px"></button><div class="status" id="status"></div></section>
 <section class="card"><h2 id="reviewTitle"></h2><div class="list" id="reviewList"></div></section>
 <section class="card"><h2 id="missionsTitle"></h2><div class="list" id="missionsList"></div></section>
 <div class="foot" id="foot"></div>
</main>
<script src="mdm-backend-config-45831341.js?v=45838235-evidence-page"></script>
<script>
(function(){'use strict';const VERSION='45.8.38.23.5',$=id=>document.getElementById(id);function parse(v){try{return v?JSON.parse(v):null}catch(_){return null}}function settings(){return parse(localStorage.getItem('mdm-v1-settings'))||{}}function lang(){const l=String(settings().lang||'en').toLowerCase();return ['it','en','mt'].includes(l)?l:'en'}function t(it,en,mt){return lang()==='it'?it:lang()==='mt'?mt:en}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function saveLang(l){const s=settings();s.lang=l;localStorage.setItem('mdm-v1-settings',JSON.stringify(s));localize();renderEmpty()}function session(){for(const k of ['mdm_auth_session_v4410','mdm_auth_session_v1','mdm-auth-session']){const s=parse(localStorage.getItem(k));if((s?.accessToken||s?.access_token)&&s?.user?.id)return s}return{}}function token(){const s=session();return s.accessToken||s.access_token||''}function cfg(){const c=window.MDM_BACKEND_CONFIG||{};const endpoint=c.endpoint||c.url||c.supabaseUrl,key=c.publishableKey||c.anonKey||c.key;if(!endpoint||!key)throw new Error('backend_config_unavailable');return{endpoint:String(endpoint).replace(/\/$/,''),key:String(key)}}async function rpc(name,payload){const c=cfg(),tk=token();if(!tk)throw new Error('authentication_required');const r=await fetch(c.endpoint+'/rest/v1/rpc/'+name,{method:'POST',headers:{'Content-Type':'application/json','apikey':c.key,'Authorization':'Bearer '+tk},body:JSON.stringify(payload||{}),cache:'no-store'});const tx=await r.text();let d={};try{d=tx?JSON.parse(tx):{}}catch(_){}if(Array.isArray(d))d=d[0]||{};if(!r.ok)throw new Error(String(d?.message||d?.error||('http_'+r.status)));return d||{}}function goBack(){if(history.length>1){history.back();return}location.replace('./')}function localize(){document.documentElement.lang=lang();$('langBtn').textContent=lang().toUpperCase();$('pageTitle').textContent='🔄 '+t('Evidenze studenti','Student Evidence','Evidenza tal-istudenti');$('pageSub').textContent=t('Missioni, prove e verifica umana.','Missions, evidence and human review.','Missjonijiet, evidenza u verifika umana.');$('assignTitle').textContent=t('Assegna missione di verifica','Assign verification mission','Assenja missjoni ta’ verifika');$('studentLabel').textContent=t('Studente','Student','Student');$('typeLabel').textContent=t('Tipo missione','Mission type','Tip ta’ missjoni');$('typeVerification').textContent=t('Verifica','Verification','Verifika');$('typePractical').textContent=t('Verifica pratica','Practical verification','Verifika prattika');$('typeTheory').textContent=t('Recupero teoria','Theory recovery','Irkupru tat-teorija');$('objectiveLabel').textContent=t('Obiettivo','Objective','Għan');$('objective').placeholder=t('Descrivi ciò che deve essere verificato','Describe what must be verified','Iddeskrivi x’għandu jiġi vverifikat');$('assignBtn').textContent='＋ '+t('Assegna','Assign','Assenja');$('reviewTitle').textContent=t('Evidenze da verificare','Evidence awaiting review','Evidenza għar-reviżjoni');$('missionsTitle').textContent=t('Missioni recenti','Recent missions','Missjonijiet riċenti');$('foot').textContent=t('Solo verifica umana · Nessuna certificazione pratica automatica','Human review only · No automatic practical certification','Verifika umana biss · Ebda ċertifikazzjoni prattika awtomatika')}function errorText(e){const c=String(e||'').toLowerCase();if(c.includes('school_not_authorized'))return t('La scuola non è ancora autorizzata a usare il backend delle evidenze.','The school is not yet authorized to use the evidence backend.','L-iskola għadha mhix awtorizzata tuża l-backend tal-evidenza.');if(c.includes('authentication_required'))return t('Accesso richiesto. Rientra nell’account scuola.','Sign-in required. Sign in again with the school account.','Huwa meħtieġ id-dħul. Erġa’ idħol bil-kont tal-iskola.');return t('Backend evidenze temporaneamente non disponibile.','Evidence backend is temporarily unavailable.','Il-backend tal-evidenza temporanjament mhux disponibbli.')}function setStatus(x,k=''){ $('status').textContent=x;$('status').className='status'+(k?' '+k:'')}function renderEmpty(){$('reviewList').innerHTML='<p class="empty">—</p>';$('missionsList').innerHTML='<p class="empty">—</p>'}function renderStudents(a){const s=$('studentSelect');if(!a.length){s.innerHTML='<option>'+esc(t('Nessuno studente attivo','No active students','L-ebda student attiv'))+'</option>';s.disabled=true;$('assignBtn').disabled=true;return}s.innerHTML=a.map(x=>'<option value="'+esc(x.student_user_id)+'">'+esc(x.student_name||x.student_email||t('Studente','Student','Student'))+'</option>').join('');s.disabled=false;$('assignBtn').disabled=false}function mTitle(m){return m?.payload?.title||m?.payload?.objective||t('Missione','Mission','Missjoni')}function mStatus(s){const m={assigned:['Assegnata','Assigned','Assenjata'],evidence_submitted:['Prova inviata','Evidence submitted','Evidenza mibgħuta'],accepted:['Accettata','Accepted','Aċċettata'],revision_requested:['Nuova prova richiesta','Revision requested','Evidenza ġdida mitluba']},v=m[s];return v?t(v[0],v[1],v[2]):t('Stato non disponibile','Status unavailable','Status mhux disponibbli')}function renderMissions(a){$('missionsList').innerHTML=a.length?a.slice(0,20).map(m=>'<article class="item"><div class="item-head"><h3>'+esc(mTitle(m))+'</h3><span class="pill">'+esc(mStatus(m.status))+'</span></div><p>'+esc(m.student_evidence?.summary||t('Nessuna evidenza allegata.','No evidence attached.','L-ebda evidenza mehmuża.'))+'</p></article>').join(''):'<p class="empty">'+t('Nessuna missione.','No missions.','L-ebda missjoni.')+'</p>'}function renderReviews(a){const p=a.filter(m=>m.status==='evidence_submitted');$('reviewList').innerHTML=p.length?p.map(m=>'<article class="item" data-mid="'+esc(m.mission_id)+'"><div class="item-head"><h3>'+esc(mTitle(m))+'</h3><span class="pill">'+t('DA VERIFICARE','AWAITING REVIEW','GĦAR-REVIŻJONI')+'</span></div><p>'+esc(m.student_evidence?.summary||t('Evidenza ricevuta.','Evidence received.','Evidenza riċevuta.'))+'</p><div class="actions"><button class="btn" data-d="accepted">✓ '+t('Accetta','Accept','Aċċetta')+'</button><button class="btn secondary" data-d="revision_requested">↺ '+t('Richiedi nuova prova','Request new evidence','Itlob evidenza ġdida')+'</button></div></article>').join(''):'<p class="empty">'+t('Nessuna evidenza in attesa.','No evidence awaiting review.','L-ebda evidenza qed tistenna reviżjoni.')+'</p>';document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{try{await rpc('mdm_school_review_mission_evidence',{p_mission_id:b.closest('[data-mid]').dataset.mid,p_decision:b.dataset.d,p_review:{human:true,source:'school-evidence-page',version:VERSION}});await load()}catch(e){setStatus('⚠️ '+errorText(e.message||e),'warn')}})}async function assign(){const st=$('studentSelect').value,o=$('objective').value.trim();if(!st||!o)return;try{await rpc('mdm_school_assign_mission',{p_student_user_id:st,p_payload:{title:o,objective:o,source:'school-evidence-page',version:VERSION},p_mission_type:$('missionType').value});$('objective').value='';await load()}catch(e){setStatus('⚠️ '+errorText(e.message||e),'warn')}}async function load(){setStatus(t('Connessione al server…','Connecting to server…','Konnessjoni mas-server…'));try{const[a,m]=await Promise.all([rpc('mdm_school_list_active_students',{}),rpc('mdm_school_list_student_missions',{p_student_user_id:null})]);if(a.authorized!==true||m.authorized!==true)throw new Error('school_not_authorized');renderStudents(Array.isArray(a.students)?a.students:[]);const ms=Array.isArray(m.missions)?m.missions:[];renderReviews(ms);renderMissions(ms);setStatus(t('Connesso. Dati aggiornati.','Connected. Data updated.','Konness. Data aġġornata.'),'ok')}catch(e){renderStudents([]);renderEmpty();setStatus('⚠️ '+errorText(e.message||e),'warn')}}$('backBtn').onclick=goBack;$('brandBtn').onclick=goBack;$('accountBtn').onclick=goBack;$('langBtn').onclick=()=>saveLang(lang()==='it'?'en':lang()==='en'?'mt':'it');$('assignBtn').onclick=assign;localize();renderEmpty();load()})();
</script>
</body>
