<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MDM Pilot Access Test 45.8.31.46</title>
<style>
body{margin:0;background:#061a2b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:calc(22px + env(safe-area-inset-top)) 18px 28px}main{max-width:620px;margin:auto}.card{background:#0d2b42;border:1px solid #31546c;border-radius:18px;padding:18px}h1{font-size:22px;margin:0 0 8px}p{color:#c8d9e5;line-height:1.45}.status{margin:16px 0;padding:14px;border-radius:14px;background:#132f44;font-weight:800;white-space:pre-wrap;word-break:break-word}.ok{background:#123b32}.warn{background:#4a3514}.bad{background:#4a2025}button{width:100%;min-height:50px;border:0;border-radius:13px;font-size:16px;font-weight:800;background:#5ee2e6;color:#052334;padding:12px}small{display:block;margin-top:14px;color:#98afbf;line-height:1.4}
</style>
</head>
<body><main><div class="card"><h1>Pilot Access 45.8.31.46</h1><p>Test isolato. Non modifica l'app.</p><div id="status" class="status">Avvio test…</div><button id="retry" type="button">Riprova test</button><small id="detail"></small></div></main>
<script src="mdm-backend-config-45831341.js?v=45831341-pilot-test2"></script>
<script>
(function(){
'use strict';
var status=document.getElementById('status'),detail=document.getElementById('detail'),retry=document.getElementById('retry');
function set(t,c){status.textContent=t;status.className='status '+(c||'');}
function deepToken(x){if(!x||typeof x!=='object')return'';if(typeof x.access_token==='string'&&x.access_token.length>20)return x.access_token;for(var k in x){if(Object.prototype.hasOwnProperty.call(x,k)){var r=deepToken(x[k]);if(r)return r;}}return'';}
function findToken(){
  var stores=[];try{stores.push(['localStorage',localStorage]);}catch(e){} try{stores.push(['sessionStorage',sessionStorage]);}catch(e){}
  var seen=[];
  for(var s=0;s<stores.length;s++){
    var name=stores[s][0],st=stores[s][1];
    for(var i=0;i<st.length;i++){
      var k=st.key(i); if(!k)continue; seen.push(name+': '+k);
      var raw=''; try{raw=st.getItem(k)||'';}catch(e){continue;}
      if(raw.indexOf('access_token')<0)continue;
      try{var tok=deepToken(JSON.parse(raw));if(tok)return{token:tok,keys:seen};}catch(e){}
    }
  }
  return{token:'',keys:seen};
}
async function run(){
 retry.disabled=true; detail.textContent=''; set('Controllo sessione…','');
 try{
   var cfg=window.MDM_BACKEND_CONFIG;if(!cfg||!cfg.endpoint||!cfg.publishableKey){set('ERRORE · configurazione backend assente','bad');return;}
   var found=findToken();
   if(!found.token){set('SESSIONE NON TROVATA','warn');detail.textContent='Chiavi viste: '+(found.keys.length?found.keys.join(' | '):'nessuna');return;}
   set('SESSIONE TROVATA · controllo backend…','');
   var res=await fetch(cfg.endpoint.replace(/\/$/,'')+'/rest/v1/rpc/mdm_check_my_pilot_entitlement',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.publishableKey,'Authorization':'Bearer '+found.token},body:'{}',cache:'no-store'});
   var txt=await res.text(),data={};try{data=JSON.parse(txt);}catch(e){}
   if(!res.ok){set('ERRORE BACKEND · HTTP '+res.status,'bad');detail.textContent=txt||'Nessun dettaglio';return;}
   var row=Array.isArray(data)?data[0]:data;
   set(row&&row.authorized===true?'PASS · BACKEND COLLEGATO · AUTHORIZED':'PASS · BACKEND COLLEGATO · NO ACTIVE LICENSE','ok');
   detail.textContent='RPC raggiunta correttamente.';
 }catch(e){set('ERRORE DI CONNESSIONE','bad');detail.textContent=String(e&&e.message||e);}
 finally{retry.disabled=false;}
}
retry.addEventListener('click',run);run();
})();
</script></body></html>
